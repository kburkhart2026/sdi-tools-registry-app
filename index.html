<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDI Tools Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- SDI brand fonts: the Playbook's Adobe Fonts kit, with its free look-alikes for
     anywhere the kit is not served (it is limited to registered web addresses). -->
<link rel="stylesheet" href="https://use.typekit.net/qbk2qzz.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  /* SDI brand */
  --crimson:#D50032; --crimson-dk:#AB0028; --bone:#ECE6DB; --amber:#7A4A00; --green:#353533;
  --bg:#F6F6F4; --card:#FFFFFF; --soft:#F6F6F4; --line:#DEDEDA; --line2:#C4C4BF; --divider:#ECECE9;
  --ink:#101820; --ink2:#4D4D49; --mute:#6E6E69; --faint:#B0B0AA;
  --brand:#4F0A12; /* SDI Maroon, as in the Playbook */
  --accent:#D50032; --accent-dk:#AB0028; --accent-bg:#F6F6F4;
  --warn:#7A4A00; --warn-bg:#FFF4E0; --warn-line:#C77700;
  --font-body:"proxima-nova","Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-cond:"proxima-nova-condensed","Saira Condensed","Arial Narrow",sans-serif;
  --shadow-sm:0 1px 2px rgba(16,24,32,.06); --shadow-md:0 2px 8px rgba(16,24,32,.08);
  --bad:#AB0028; --bad-bg:#FBE9EE; --ok:#353533; --ok-bg:#ECECE9;
  --panel-w:440px; --rail-w:300px;
  /* Color roles (Design handoff, 2026-10-05). Each color has one meaning:
     ink = data and the SDI-supplied marker; crimson = primary button, links,
     the selected row; maroon = the app bar; bone/tan = the student-supplied
     marker and selection; gray = reused, empty and secondary; amber = needs
     attention. Program colors are the one exception, on program tags only. */
  --sdi-black:#101820; --sdi-bone:#ECE6DB; --sdi-tan:#C9B79C; --sdi-tan-600:#A18E72;
  --gray-50:#F6F6F4; --gray-100:#ECECE9; --gray-200:#DEDEDA; --gray-300:#C4C4BF; --gray-400:#9A9A94; --gray-500:#6E6E69; --gray-600:#4D4D49; --gray-700:#353533;
  --border-subtle:#DEDEDA; --border-default:#C4C4BF;
  --amber-line:#C77700; --amber-text:#7A4A00; --amber-bg:#FFF4E0;
  /* who supplies a tool: SDI (ink square), or the student (bone square, tan border) */
  --sdi:#101820; --sdi-bg:#F6F6F4; --stu:#353533; --stu-bg:#ECE6DB; --stu-dot:#ECE6DB;
  /* a tool reused in a later course, at no added cost */
  --reuse:#6E6E69; --reuse-bg:#F6F6F4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;display:flex;flex-direction:column}
a{color:var(--accent)} a:hover{color:var(--accent-dk)}
h1,h2,h3{font-family:var(--font-cond);font-weight:700;margin:0;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.top{height:56px;flex-shrink:0;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-cond);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px}
.pill-btn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:3px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill-btn:hover{background:rgba(255,255,255,.26)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:260px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:6px;z-index:40}
.menu[hidden]{display:none}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:3px;padding:9px 10px;color:inherit}
.menu button:hover,.menu button.on{background:var(--accent-bg)}
.menu b{display:block;font-size:14px} .menu small{color:var(--mute);font-size:12.5px}
.grp{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700}
.pool{border:2px dashed var(--warn-line);background:#FFFCF5;border-radius:12px;padding:14px;margin:18px 0 6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.pick{border:1px solid var(--line2);border-radius:9px;background:#fff;padding:9px 11px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;text-align:left;font:inherit;color:inherit}
.pick:hover{border-color:var(--warn)}
.pick.on{border:2px solid var(--warn);padding:8px 10px;background:var(--warn-bg)}
.pick.off{opacity:.45;cursor:not-allowed}
.pick .box2{width:18px;height:18px;border-radius:5px;border:2px solid var(--line2);flex-shrink:0;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.pick.on .box2{background:var(--warn);border-color:var(--warn)}
.pick .c{display:block;font-family:var(--font-cond);font-weight:600;font-size:14px} .pick .t{display:block;font-size:12.5px;color:var(--ink2)} .pick .m{display:block;font-family:var(--font-cond);font-size:14px;margin-top:2px}
.caret{border:0;background:none;padding:2px;margin-left:-4px;border-radius:5px;color:var(--mute);display:inline-grid;place-items:center;transition:transform .15s}
.caret.open{transform:rotate(90deg)} .caret:hover{background:#EFECE5;color:var(--ink)}
.lh.click{cursor:pointer} .lh.click:hover{background:#FBFAF7}
@media (prefers-reduced-motion:reduce){ .caret{transition:none} }
.tab.tool{color:var(--accent-dk);font-weight:700;border-bottom-color:var(--accent)}
.ptag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px 1px 6px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.65;vertical-align:middle}
.pdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.ticon{display:inline-flex;vertical-align:-3px;margin-right:7px}
.band{position:relative;overflow:hidden;color:#fff;border-radius:10px;padding:18px 18px 16px;margin-bottom:14px}
.band .mono{position:absolute;right:18px;bottom:-10px;opacity:.22;pointer-events:none}
.band h2{font-size:21px} .band .g{color:rgba(255,255,255,.85)}
.band .amt{position:relative;text-align:right}
.band>.row{padding-right:120px}
@media (max-width:900px){ .band>.row{padding-right:0} .band .mono{opacity:.12} }
.band .chip.warn{background:rgba(255,255,255,.92)}
.tile{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.swatches{display:grid;grid-template-columns:repeat(4,30px);gap:5px}
.swatches button{width:30px;height:24px;border-radius:6px;border:0;cursor:pointer}
.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.icons{display:grid;grid-template-columns:repeat(6,40px);gap:5px}
.icons button{width:40px;height:38px;border:1px solid var(--line2);border-radius:7px;background:#fff;display:grid;place-items:center;cursor:pointer}
.icons button.on{border:2px solid var(--ink)}
.picker{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin:10px 0}
.pv{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.pv .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:6px 0 4px}
.tabs{height:46px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px;overflow-x:auto}
.tabs .t{display:flex;gap:22px;height:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;height:100%;padding:0;font-size:14px;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.hint{font-size:12.5px;color:var(--mute);white-space:nowrap}
.banner{padding:10px 20px;font-size:14px;border-bottom:1px solid var(--line)}
.banner.warn{background:var(--warn-bg);color:#5a3b00;border-color:var(--warn-line)}
.banner.bad{background:var(--bad-bg);color:#6b1526;border-color:#e8c2ca}
.banner.info{background:var(--bone);color:var(--ink2)}
.banner button{margin-left:8px}
.shell{flex:1;min-height:0;display:flex}
main{flex:1;min-width:0;overflow:auto;padding:18px 20px 40px}
aside{width:var(--panel-w);flex-shrink:0;background:var(--card);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
aside[hidden]{display:none}
aside.wide{position:fixed;inset:56px 0 0 0;width:auto;z-index:20;border-left:0}
/* On the Course Registry the record being edited is the point of the page, so
   the panel takes most of the width and the list shrinks to a picker. */
aside.editor{width:min(66%, 1040px);min-width:520px}
aside.editor .pb{padding:18px 24px 32px}
.crs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
aside.editor .crs-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.crs-grid .span2{grid-column:span 2} .crs-grid .span4{grid-column:1 / -1}
.savebar{position:sticky;bottom:0;z-index:1;background:var(--card);border-top:1px solid var(--line);margin:14px -24px 18px;padding:10px 24px;display:flex;gap:12px;align-items:center}
.prog-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
aside.editor .prog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.ph{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:1}
.ph h2{font-size:17px}
.ph .sub{font-size:13px;color:var(--mute);margin-top:2px}
.pb{padding:14px 16px 28px}
.iconbtn{background:none;border:1px solid transparent;border-radius:6px;color:var(--mute);padding:2px 7px;font-size:15px;line-height:1.3}
.iconbtn:hover{border-color:var(--line);color:var(--ink)}
footer{flex-shrink:0;background:var(--card);border-top:1px solid var(--line);padding:7px 20px;font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer .sp{flex:1}
.btn{border:2px solid var(--line2);background:var(--card);color:var(--ink);border-radius:3px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-dk)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:inherit}
.link:hover{text-decoration:underline}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1 1 260px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.field small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.in{width:100%;border:2px solid var(--line2);border-radius:3px;padding:7px 10px;background:#fff}
.in:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.in.inline{width:auto}
.in.qty{width:64px;padding:4px 6px;text-align:right}
.in[readonly]{background:var(--soft);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#FBFAF7}
tr.sel td{background:var(--accent-bg)!important}
td.num,th.num{text-align:right;white-space:nowrap}
td{overflow-wrap:anywhere}
td:first-child{min-width:220px}
table.ptable{table-layout:fixed}
table.ptable th{padding:6px 12px} table.ptable td{padding:6px 12px}
table.ptable td .g{font-size:12.5px;line-height:1.3}
.csum{font-family:var(--font-cond);font-size:17px;font-weight:600;white-space:nowrap;margin-left:6px}
table.ptable td:first-child{min-width:0}
.g{color:var(--mute);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.info{background:var(--bone);color:var(--ink2)}
.chip.mute{background:#EFECE5;color:var(--ink2)}
.note{border-radius:6px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:#5a3b00}
.note.bad{background:var(--bad-bg);border:1px solid #e8c2ca;color:#6b1526}
.note.info{background:var(--bone);color:var(--ink2)}
.note.plain{background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 10px 10px}
.total .big{font-family:var(--font-cond);font-size:20px;font-weight:600}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lh h3{font-size:15px}
.stack>*+*{margin-top:14px}
.muted-list{list-style:none;margin:0;padding:0}
.muted-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.muted-list li:last-child{border-bottom:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.welcome{max-width:760px;margin:30px auto}
.welcome .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.welcome .card{padding:18px}
.welcome p{color:var(--ink2)}
.diff li{font-size:13.5px}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:9px;padding:9px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none;max-width:min(640px,92vw);z-index:50}
#toast.err{background:var(--bad)}
#toast button{background:none;border:0;color:#fff;font-weight:700;text-decoration:underline;margin-left:10px}
.sr{position:absolute;left:-9999px}
@media (max-width:900px){
  aside:not([hidden]){position:fixed;inset:56px 0 0 0;width:auto;min-width:0;z-index:20}
  .crs-grid,aside.editor .crs-grid,aside.editor .prog-grid{grid-template-columns:1fr} .crs-grid .span2{grid-column:auto}
  .top{padding:0 12px} .brand{font-size:15px;min-width:0}
  .who{min-width:0} #whoBtn{max-width:130px;overflow:hidden;text-overflow:ellipsis}
  .card{overflow-x:auto}
  table.ptable{min-width:640px}
  td:first-child{min-width:160px}
  .welcome .grid{grid-template-columns:1fr}
  .hint{display:none}
  main{padding:14px 16px 40px}
}
/* ---- Tools by Program: split ledger ---- */
.ledger{--ld-left:240px}
.lg-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lg-toolbar .grow{flex:1}
.lg-btn{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:6px 14px}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.pri:hover{background:var(--crimson-dk);border-color:var(--crimson-dk);color:#fff}
.lg-eyebrow{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;letter-spacing:.17em;font-size:12px;color:var(--ink2)}
.lg-red{color:var(--crimson)}
.rule{display:block;width:56px;height:3px;background:var(--crimson);margin-top:6px}
.lg-amber{color:var(--amber);font-weight:600}
/* summary */
.lg-summary{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px minmax(240px,300px);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--crimson);border-radius:6px;box-shadow:var(--shadow-md);margin-bottom:22px;overflow:hidden}
.lg-cell{padding:18px 20px;display:flex;flex-direction:column;gap:4px;justify-content:center;border-left:1px solid var(--line)}
.lg-cell:first-child{border-left:0}
.lg-name h2{font-size:30px;line-height:1.05;text-transform:uppercase;color:var(--ink)}
.lg-num{font-family:var(--font-cond);font-weight:700;font-size:30px;line-height:1.1;color:var(--ink)}
.lg-bone{background:var(--bone)}
.lg-big{font-family:var(--font-cond);font-weight:700;font-size:34px;line-height:1.1;color:var(--ink)}
.lg-big small,.lg-total small,.lg-total-lg small{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--mute)}
.lg-count{font-size:13px;color:var(--mute)}
.lg-count.lg-amber{color:var(--amber)}
/* section labels */
.lg-section{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 2px 10px}
.lg-section-r{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--ink2);display:inline-flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* cards */
.lg-list{display:flex;flex-direction:column;gap:8px}
.lg-card{display:grid;grid-template-columns:var(--ld-left) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--crimson);border-radius:6px;box-shadow:var(--shadow-sm);overflow:hidden}
.lg-card[data-act]{cursor:pointer}
.lg-card[data-act]:hover{background:var(--soft)}
.lg-left{padding:14px 16px;border-right:1px solid var(--line);display:flex;align-items:center;min-width:0}
.lg-right{min-width:0}
.lg-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px}
.lg-code{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--crimson);font-family:var(--font-cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.lg-code:hover{color:var(--crimson-dk)}
.lg-chev{display:inline-grid;place-items:center;transition:transform .15s}
.lg-chev.open{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){ .lg-chev{transition:none} }
.lg-title{font-family:var(--font-cond);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);min-width:0}
.lg-el{display:inline-block;font-family:var(--font-body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:0 5px;vertical-align:3px;margin-left:6px}
.lg-meta{display:flex;align-items:center;gap:16px;flex-shrink:0;font-size:13px;color:var(--mute)}
.lg-total{font-family:var(--font-cond);font-weight:700;font-size:22px;color:var(--ink);white-space:nowrap}
.lg-unknown{display:inline-block;font-family:var(--font-cond);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1.5px solid var(--amber);border-radius:3px;padding:1px 8px;white-space:nowrap}
/* expanded */
.lg-panel{background:var(--bone);flex-direction:column;align-items:flex-start;gap:8px;padding:20px}
.lg-title-lg{font-size:22px;line-height:1.1;text-transform:uppercase;color:var(--ink)}
.lg-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg-flags{display:flex;flex-direction:column;gap:4px}
.lg-flag{font-size:12.5px;font-weight:700;color:var(--crimson)} .lg-flag-quiet{color:var(--ink2);font-weight:600}
.lg-spacer{flex:1;min-height:6px}
.lg-open{font-size:13px;color:var(--crimson);font-weight:700}
.lg-total-lg{font-family:var(--font-cond);font-weight:700;font-size:30px;line-height:1.05;color:var(--ink);white-space:nowrap}

.cc-code .lg-chev{color:var(--gray-400);width:14px}
.cc.sel .cc-code{color:var(--crimson)}
.cc-tag{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-600);border:1px solid var(--border-default);border-radius:3px;padding:0 5px;line-height:1.6}
.cc-name{font-size:14px;font-weight:600;color:var(--gray-700);margin-top:1px;padding-left:22px}

.cc.open .cc-code{font-size:15px;letter-spacing:.06em}
.cc.open .cc-name{font-family:var(--font-cond);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1.05;color:var(--sdi-black);letter-spacing:.02em;padding-left:0;margin-top:2px}
.cc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13px}
.cc-tot{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.cc-v{font-family:var(--font-cond);font-weight:700;font-size:20px;color:var(--sdi-black);line-height:1;white-space:nowrap}
.cc.open .cc-v{font-size:32px}
.cc-s{font-size:12.5px;color:var(--gray-500);white-space:nowrap} .cc-s.a{color:var(--amber-text);font-weight:700}
.cc-unk{font-family:var(--font-cond);font-weight:700;font-size:16px;color:var(--amber-text);white-space:nowrap}
.cc-none{font-family:var(--font-cond);font-weight:700;font-size:16px;color:var(--gray-500);white-space:nowrap}
.cc-acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:0 20px 12px;font-size:13.5px}

.cc-acts .link{text-decoration:underline;text-underline-offset:3px}
.cc-reuse{min-height:0;font-size:13px;padding:4px 8px;max-width:220px}
.cc-msg{margin:0;padding:0 20px 16px;color:var(--gray-500);font-size:14px} .cc-msg.a{color:var(--amber-text);font-weight:700}
.ptag{border:1px solid var(--border-subtle);border-radius:3px;background:#fff!important;color:var(--gray-700)!important}
/* tools table */
.tt{margin:0 20px 18px;border:1px solid var(--border-subtle);border-radius:6px;overflow-x:auto}
.tt table{font-size:13.5px;min-width:760px}

.tt td{padding:9px 10px;border-bottom:1px solid var(--border-subtle)}

.tt .nw{white-space:nowrap}
.tt .line{font-weight:700;color:var(--sdi-black)}
.tt .sku{font-size:12.5px;color:var(--gray-600);overflow-wrap:anywhere}

.tm{font-size:12.5px;color:var(--gray-500);margin-top:2px}
.tm .link{font-size:12.5px}
.tlink{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:700;color:var(--sdi-black);text-decoration:underline;text-decoration-color:var(--gray-300);text-underline-offset:3px}

.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--amber-line);color:var(--amber-text);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}

table.edt{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}

<script>
'use strict';
/* ============================================================
   SDI Tools Registry

   One JSON file, registry.json, in a PRIVATE GitHub repo.

   Access (2026-10-07): named Editors and one Viewer link.
   - Each editor has their own fine-grained token, kept in the public
     app repo's editors.json locked with their own password (AES-GCM,
     PBKDF2 4,000,000 rounds). Karen adds them; a setup code unlocks
     the token once so the editor can set the password.
   - Viewers unlock one read-only token (viewer-key.json) that can
     open only the view repo. Every editor save also writes view.json
     there: the same data with every cost removed. Prices never leave
     the private data repo.

   Cost per course is sum(qty x price) and nobody types it.

   Recoverability replaces staging:
   - every save is a git commit, so the whole history is on GitHub;
   - a snapshot of the current version is kept in this browser
     before every save;
   - any version (GitHub, snapshot or downloaded file) can be
     previewed as a list of changes before it is restored;
   - a restore is itself a new save, so it can be undone the same way;
   - nothing is ever deleted: tools are archived, never removed.

   Unknown is never zero. A tool with no price makes its course
   incomplete; a course nobody has listed reads "unknown", not $0.
   ============================================================ */

const FILE = 'registry.json';
const SNAP_MAX = 200;
const LS = { cfg:'str_cfg', token:'str_token', user:'str_user', lastBackup:'str_last_backup', tab:'str_tab' };
const ROLES = {
  // 2026-10-07: roles went away. Every editor can do everything; a viewer
  // can do nothing and never sees a cost. The keys are kept so stored data reads.
  pd:          { label:'Editor', tabs:['program'], tools:['registry','catalog'], courses:true,  assign:true,  price:true, text:true,  add:true,  rule:true,  costs:true },
  published:   { label:'Viewer', tabs:['program'], tools:[], courses:false, assign:false, price:false, text:false, add:false, rule:false, costs:false },
};
// First week used: a whole week of the course, 1 to WEEK_MAX.
const WEEK_MAX = 52;
const TOOL_HINT = { registry:'Add and edit courses and programs', catalog:'Every tool, its price, vendor and link' };
const TAB_LABEL = { courses:'Tools by Course', catalog:'Full Tool Catalog', program:'Tools by Program', registry:'Course Registry' };

/* ---- the course registry: the same record shape as the Playbook's Course Database ----
   ONE record per course-in-a-delivery. `code` is not unique: a gen-ed that runs
   5-week and 8-week is two records. A course's tool list attaches to the CODE,
   so both deliveries share one list. Field definitions drive the table, the
   panel and the CSV, so a new field appears everywhere at once. */
const CRS_FIELDS = [
  { key:'code',               label:'Code',                  short:'Code',     type:'text' },
  { key:'title',              label:'Course Title',          short:'Title',    type:'text' },
  { key:'deliveryLabel',      label:'Delivery',              short:'Delivery', type:'text' },
  { key:'credits',            label:'Semester Credit Hours', short:'SCH',      type:'number' },
  { key:'weeks',              label:'Length in Weeks/Modules',       short:'Wks',      type:'number' },
  { key:'prereqs',            label:'Prerequisites',         short:'Prereq',   type:'list' },
  { key:'category',           label:'Category',              short:'Category', type:'text' },
  { key:'school',             label:'School',                short:'School',   type:'text' },
  { key:'status',             label:'Status',                short:'Status',   type:'text' },
];
// Category is a label for the course everywhere. Required or elective is set per
// program, and that is what program totals and elective picks use.
const CRS_CATEGORIES = ['Core', 'Elective', 'Gened'];
function crsCategory(v){ return { core:'Core', elective:'Elective', gened:'Gened', 'gen ed':'Gened', 'general education':'Gened' }[String(v || '').trim().toLowerCase()] || null; }
const CRS_SCHOOLS = [
  { id:'SUT',    label:'SUT — Uncrewed' },
  { id:'SFT',    label:'SFT — Firearms' },
  { id:'Geneds', label:'Geneds — General Education' },
];
const CRS_STATUSES = [
  { id:'active',  label:'Active',  hint:'In a published catalog edition' },
  { id:'draft',   label:'Draft',   hint:'Not yet in the catalog' },
  { id:'retired', label:'Retired', hint:'No longer offered' },
];
// Names as the Playbook has them. The ids stay what the tool lists were keyed
// by when the workbook was imported; only the code and name are shown.
const SEED_PROGRAMS = {
  'CUT-MT': { code:'CUT-MT', name:'Certificate in Uncrewed Technology Maintenance Technician', school:'SUT', color:'#1A4A6B', icon:'wrench' },
  'CUT-F':  { code:'CUT-F',  name:'Certificate in Uncrewed Technology - Flight Operations', school:'SUT', color:'#C0202A', icon:'flight' },
  'CUT-AS': { code:'ASUT',   name:'Associates in Uncrewed Technology', school:'SUT', color:'#1B6B5A', icon:'quad' },
};

// Electives, as the workbook's ASUT Margins block states them: choose 2 from
// this pool, priced at its lowest- and highest-cost pairs. Applied once, the
// first time a program is seen without an elective setting.
const SEED_ELECTIVES = {
  'CUT-AS': { count:2, codes:['SYS 201','UAS 204','UAS 205','UAS 206','UAS 208','UAS 210'],
    scenarios:[ { id:'sc-lowest', name:'Lowest cost', electives:['UAS 206','UAS 208'], primary:true },
                { id:'sc-highest', name:'Highest cost', electives:['UAS 210','SYS 201'] } ] },
};
function isElective(d, code, pid){ return d.courseDb.courses.some(r => r.code === code && (r.electiveIn || []).includes(pid)); }
function electivePool(d, pid){ return [...new Set(d.courseDb.courses.filter(r => (r.electiveIn || []).includes(pid)).map(r => r.code))].sort(byCode); }

/* ---- program colors and icons: the Playbook's own set, copied exactly, so a

  flight:{n:'Flight ops',p:'<ellipse cx="5.2" cy="5.6" rx="3.2" ry="1.2"/><ellipse cx="18.8" cy="5.6" rx="3.2" ry="1.2"/><path d="M7.4 7.2 9.6 9.4M16.6 7.2 14.4 9.4"/><rect x="9" y="9.4" width="6" height="5" rx="1.2"/><path d="M5.6 18.2c2.1 1.7 4.3 1.7 6.4 0s4.3-1.7 6.4 0"/>'},
  signal:{n:'Signal',p:'<path d="M4.9 16.1a9 9 0 0 1 0-12.7M7.8 13.2a5 5 0 0 1 0-6.9M19.1 3.4a9 9 0 0 1 0 12.7M16.2 6.3a5 5 0 0 1 0 6.9"/><circle cx="12" cy="9.8" r="1.6"/><path d="M12 11.6V21M8.6 21h6.8"/>'},

  route:{n:'Pathway',p:'<circle cx="6" cy="19" r="2.6"/><circle cx="18" cy="5" r="2.6"/><path d="M8.6 19h8.9a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7h8.9"/>'},
  rifle:{n:'Rifle',p:'<path d="M2.8 16.4 6.8 14.7v-3.3h14.4v2.2H12.6l-1.2 2.2H8.4l-1.1 1.7z"/><path d="M10.6 15.8a1.7 1.7 0 0 0 1.7 1.5"/><path d="M13.6 11.4V9.6h3.2v1.8"/>'},
  cartridge:{n:'Cartridge',p:'<path d="M12 2.4c1.7 1.5 2.7 3.4 2.7 5.3v.9H9.3V7.7c0-1.9 1-3.8 2.7-5.3z"/><path d="M9.3 8.6h5.4v9.2H9.3z"/><path d="M8.5 17.8h7v2.6h-7z"/><path d="M9.3 15.4h5.4"/>'},
  reticle:{n:'Reticle',p:'<circle cx="12" cy="12" r="8.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.2"/>'},
  vise:{n:'Vise',p:'<path d="M3.5 8.5h4.8v7H3.5zM13 8.5h4.8v7H13z"/><path d="M8.3 12h4.7M17.8 12h3.2"/><path d="M6 15.5v3.8h11v-3.8"/><path d="M4.5 19.3h14"/>'},

function when(ts){ if(!ts) return 'never'; const d = new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year: d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function ago(ts){ if(!ts) return 'never'; const m = Math.round((Date.now()-ts)/60000); if(m < 1) return 'just now'; if(m < 60) return m+' min ago'; const h = Math.round(m/60); if(h < 24) return h+' hr ago'; const d = Math.round(h/24); return d+(d===1?' day':' days')+' ago'; }
function progLabel(k){ if(k === '*') return 'All programs'; const p = programById(k); return p ? p.code : k; }
function role(){ return ROLES[user.role]; }
// The Tools menu (Course Registry, Full Tool Catalog) is for people who can
// write. A read-only token hides it even for an editing role.
function toolViews(){ return S.repoInfo && S.repoInfo.permissions && S.repoInfo.permissions.push === false ? [] : role().tools; }
function allowedView(t){ return role().tabs.includes(t) || toolViews().includes(t); }
function repoLabel(){ return cfg.owner && cfg.repo ? cfg.owner+'/'+cfg.repo : ''; }
function canEdit(){ return !!S.doc && S.mode !== 'none' && S.mode !== 'view' && !S.problem && !S.busy; }
function can(what){ return canEdit() && !!role()[what]; }

/* ---------------- IndexedDB: snapshots + last-read cache ---------------- */
// Browser storage is a safety net, never a gate: if it stalls (another tab
// holding it, a private window), each call gives up after a few seconds so a
// save to GitHub is never held hostage by a local snapshot.
let _db = null;
const IDB_WAIT_MS = 4000;
function timed(promise, what){ return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(what+' timed out')), IDB_WAIT_MS))]); }
function idbReq(r){ return timed(new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }), 'browser storage'); }
async function idb(){
  if(_db) return _db;
  const db = await timed(new Promise((res, rej) => {
    const r = indexedDB.open('sdi-tools-registry', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('snapshots', { keyPath:'id', autoIncrement:true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }), 'opening browser storage');
  // Let another tab upgrade or clear storage instead of waiting on this one.
  db.onversionchange = () => { db.close(); _db = null; };
  _db = db;
  return _db;
}
async function os(name, mode){ return (await idb()).transaction(name, mode).objectStore(name); }
async function kvGet(k){ try{ return await idbReq((await os('kv','readonly')).get(k)); }catch(e){ return undefined; } }
async function kvSet(k, v){ try{ await idbReq((await os('kv','readwrite')).put(v, k)); return true; }catch(e){ return false; } }
async function snapList(){ try{ return (await idbReq((await os('snapshots','readonly')).getAll())).sort((a,b) => b.ts - a.ts); }catch(e){ return []; } }
async function snapAdd(reason, doc, sha){
  if(!doc) return false;
  try{
    await idbReq((await os('snapshots','readwrite')).add({ ts:Date.now(), reason, sha, where: S.mode==='github' ? repoLabel() : 'this browser', doc: clone(doc) }));
    const all = await snapList();
    if(all.length > SNAP_MAX){ const s = await os('snapshots','readwrite'); all.slice(SNAP_MAX).forEach(x => s.delete(x.id)); }
    return true;
  }catch(e){ return false; }
}

/* ---------------- GitHub ---------------- */
const GH = 'https://api.github.com';
// Kept in memory too, so a browser that refuses localStorage (some private
// windows, some file:// pages) can still connect for this visit.
let _tokMem = '';
function token(){ return (session && session.token) || _tokMem; }
function ghUrl(p, repo){ return GH+'/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(repo || cfg.repo)+p; }
function ghText(status, kind){
  if(kind === 'network') return 'No response from GitHub. You may be offline, or the request was blocked.';
  if(status === 401) return 'GitHub no longer accepts your access (401). It may have expired or been removed. Ask Karen B. to renew it.';
  if(status === 403) return 'GitHub refused (403). The token may lack permission, or the rate limit was hit. Wait a minute and retry.';
  if(status === 404) return 'This token cannot see '+repoLabel()+' (404). Check the repo name, and that the token lists this repo.';
  if(status === 409 || status === 422) return 'Someone else was saving at the same moment, and retrying did not settle it. Nothing was lost. Try again.';
  if(status >= 500) return 'GitHub is having problems ('+status+'). Try again shortly.';
  return 'GitHub returned '+status+'.';
}
function ghErr(status, kind){ const e = new Error(ghText(status, kind)); e.status = status; e.kind = kind; return e; }
async function gh(p, opt, repo, tok){
  opt = opt || {};
  const t = tok || token(), headers = { Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(t) headers.Authorization = 'Bearer '+t;
  if(opt.body) headers['Content-Type'] = 'application/json';
  try{ return await fetch(ghUrl(p, repo), Object.assign({}, opt, { headers, cache:'no-store' })); }
  catch(e){ throw ghErr(0, 'network'); }
}
// Every commit carries the editor's name, so GitHub's history reads "Rick B." too.
function ghAuthor(){ return session && session.kind === 'editor' && session.name ? { name:session.name, email:'tools-registry@users.noreply.github.com' } : undefined; }
// A JSON file in one of the other repos: { data, sha } or { missing:true }.
async function ghGetJson(repo, file, tok){
  const r = await gh('/contents/'+file+'?ref='+ACCESS.branch, {}, repo, tok);
  if(r.status === 404) return { missing:true };
  if(!r.ok) throw ghErr(r.status);
  const m = await r.json();
  let text;
  if(m.content && m.encoding === 'base64') text = unb64(m.content);
  else { const b = await gh('/git/blobs/'+m.sha, {}, repo, tok); if(!b.ok) throw ghErr(b.status); text = unb64((await b.json()).content); }
  return { data: JSON.parse(text), sha:m.sha };
}
async function ghPutJson(repo, file, data, sha, message, tok){
  const body = { message, content: b64(JSON.stringify(data, null, 1)+'\n'), branch: ACCESS.branch, author: ghAuthor() };
  if(sha) body.sha = sha;
  const r = await gh('/contents/'+file, { method:'PUT', body: JSON.stringify(body) }, repo, tok);
  if(r.ok){ const j = await r.json(); return { sha:j.content.sha }; }
  if(r.status === 409 || r.status === 422) return { conflict:true };
  throw ghErr(r.status);
}
// The public key files, before anyone has signed in. The API answers fresh; if
// this office has used up GitHub's hourly allowance, the published page's copy
// (up to a few minutes old) is the fallback.
async function pubRead(file){
  try{
    const r = await fetch(GH+'/repos/'+ACCESS.owner+'/'+ACCESS.app+'/contents/'+file+'?ref='+ACCESS.branch, { headers:{ Accept:'application/vnd.github.raw+json' }, cache:'no-store' });
    if(r.status === 404) return null;
    if(r.ok) return JSON.parse(await r.text());
  }catch(e){}
  for(const u of [APP_URL+file, 'https://raw.githubusercontent.com/'+ACCESS.owner+'/'+ACCESS.app+'/'+ACCESS.branch+'/'+file]){
    try{ const r = await fetch(u+'?t='+Date.now(), { cache:'no-store' }); if(r.status === 404) return null; if(r.ok) return JSON.parse(await r.text()); }catch(e){}
  }
  throw new Error('GitHub could not be reached. Check the connection and try again.');
}
function b64(str){ const b = new TextEncoder().encode(str); let x = ''; for(let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(x); }
function unb64(s){ const bin = atob(s.replace(/\n/g,'')); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function ghRepo(){ const r = await gh(''); if(!r.ok) throw ghErr(r.status); return r.json(); }
// Reads the file this person works from: the data for an editor, the cost-free copy for a viewer.
function readCurrent(){ return S.mode === 'view' ? ghRead(null, ACCESS.view, VIEW_FILE) : ghRead(); }
// Returns { doc, sha } or { missing:true } when the repo is there but has no registry yet.
async function ghRead(ref, repo, file){
  file = file || FILE;
  const r = await gh('/contents/'+file+'?ref='+encodeURIComponent(ref || cfg.branch), {}, repo);
  if(r.status === 404){ const rr = await gh('', {}, repo); if(rr.ok && !ref) return { missing:true }; throw ghErr(rr.ok ? 404 : rr.status); }
  if(!r.ok) throw ghErr(r.status);
  const m = await r.json();
  let text;
  if(m.content && m.encoding === 'base64') text = unb64(m.content);
  else { const b = await gh('/git/blobs/'+m.sha, {}, repo); if(!b.ok) throw ghErr(b.status); text = unb64((await b.json()).content); }
  let doc; try{ doc = JSON.parse(text); }catch(e){ throw new Error(file+' on GitHub is not valid JSON. Restore an earlier version from Backups.'); }
  return { doc, sha:m.sha };
}
// sha is the version this save is based on. GitHub refuses the write if the file
// has moved since, which is what stops two people silently overwriting each other.
async function ghWrite(doc, sha, message){
  const body = { message, content: b64(JSON.stringify(doc, null, 1)+'\n'), branch: cfg.branch, author: ghAuthor() };
  if(sha) body.sha = sha;
  const r = await gh('/contents/'+FILE, { method:'PUT', body: JSON.stringify(body) });
  if(r.ok){ const j = await r.json(); return { sha:j.content.sha, commit:j.commit.sha }; }
  if(r.status === 409 || r.status === 422) return { conflict:true };
  throw ghErr(r.status);
}
async function ghCommits(){
  const r = await gh('/commits?path='+FILE+'&sha='+encodeURIComponent(cfg.branch)+'&per_page=60');
  if(!r.ok) throw ghErr(r.status);
  return r.json();
}

/* ---------------- the document ---------------- */
function migrate(d){
  d.duplicates = d.duplicates || [];
  d.programs = d.programs || [];
  d.items = d.items || {}; d.courses = d.courses || {};
  Object.values(d.items).forEach(it => {
    it.costHistory = it.costHistory || [];
    if(!TOOL_TYPES.some(x => x.id === it.type)) it.type = guessType(it);
    // 2026-09-29: Brand took the generic name's place, and what the generic
    // name said moved into Notes, so nothing typed there is lost.
    if(it.notes === undefined) it.notes = String(it.generic || '').trim();
    if(typeof it.notes !== 'string') it.notes = String(it.notes ?? '');
    // 2026-09-30: Generic name came back as its own field, for Word exports.
    // Filled once from Notes, where the old generic names went.
    if(typeof it.generic !== 'string') it.generic = genericFromNotes(it);
    if(typeof it.brand !== 'string') it.brand = '';
    it.brandRequired = !!it.brandRequired;
    if(it.supplied !== 'student') it.supplied = 'sdi';
    if(!KINDS.some(k => k.id === it.kind)) it.kind = '';
    if(typeof it.sdiSku !== 'string') it.sdiSku = '';
    // The workbook put some ISBNs in the SKU column; take them from there once.
    if(it.isbn === undefined){ const m = String(it.sku || '').match(/ISBN:?\s*(97[89]\d{10}|\d{9}[\dX])\b/i); it.isbn = m ? m[1].toUpperCase() : ''; }
    it.isbn = isbnClean(it.isbn);
    // 2026-10-06: textbook details. VBIDs typed into the SKU are copied out once.
    if(it.vbid === undefined){ const m = String(it.sku || '').match(/VBID:?\s*([A-Za-z0-9]+)/i); it.vbid = m ? m[1] : ''; }
    for(const f of ['edition', 'vbid', 'printIsbn']) if(typeof it[f] !== 'string') it[f] = '';
    it.printIsbn = isbnClean(it.printIsbn); it.adaPrint = !!it.adaPrint;
    if(it.adaCost != null && typeof it.adaCost !== 'number') it.adaCost = null;
    // Price locks were retired on 2026-09-29. The price history keeps every figure.
    delete it.costLock;
    // 2026-10-06: the week of each course the tool is first used in, by course code.
    const wk = {};
    if(it.weeks && typeof it.weeks === 'object') for(const [c, w] of Object.entries(it.weeks)) if(Number.isInteger(w) && w >= 1 && w <= WEEK_MAX) wk[c] = w;
    it.weeks = wk;
  });
  // Owner was retired on 2026-10-05.
  Object.values(d.courses).forEach(c => { c.lists = c.lists || {}; c.materials = c.materials || 'unknown'; delete c.owner; });
  if(!d.nextItem) d.nextItem = Object.keys(d.items).length + 1;
  migrateRegistry(d);
  // 2026-10-06: the changelog, written by hand alongside a save.
  if(d.changelog != null){
    if(typeof d.changelog !== 'object' || Array.isArray(d.changelog)) d.changelog = {};
    d.changelog.posts = (Array.isArray(d.changelog.posts) ? d.changelog.posts : []).filter(e => e && typeof e === 'object');
    d.changelog.posts.forEach(e => { for(const k of ['changes','items','courses']) if(!Array.isArray(e[k])) e[k] = []; e.headline = String(e.headline ?? ''); e.note = String(e.note ?? ''); e.by = String(e.by ?? ''); e.ts = String(e.ts ?? ''); });
  }
  // Courses a tool is carried into, at no added cost. Only codes that still exist.
  Object.values(d.items).forEach(it => { it.usedIn = [...new Set((Array.isArray(it.usedIn) ? it.usedIn : []).map(String))].filter(c => d.courses[c]).sort(byCode); });
  return d;
}
// Builds the course registry the first time a file without one is opened, then
// keeps the two sides in step: every registry code has a tool list, and every
// tool list has at least one registry record. Title and programs on the tool
// list are copies of the registry, refreshed here, never edited directly.
function migrateRegistry(d){
  const db = d.courseDb = d.courseDb || {};
  db.courses = db.courses || []; db.programs = db.programs || [];
  db.schools = db.schools || [];
  // 2026-10-06: Catalog Edition, Gen Ed Area, Description and Learning Objectives
  // were removed (all blank), and Category became Core, Elective or Gened.
  delete db.categories;
  db.courses.forEach(r => { delete r.genEdArea; delete r.description; delete r.learningObjectives; delete r.catalogEdition;
    r.category = crsCategory(r.category); if(!r.category && r.school === 'Geneds') r.category = 'Gened'; });
  if(!db.programs.length){
    const ids = new Set(d.programs || []);
    Object.values(d.courses).forEach(c => { (c.programs || []).forEach(p => ids.add(p)); Object.keys(c.lists).forEach(k => { if(k !== '*') ids.add(k); }); });
    db.programs = [...ids].sort().map(id => Object.assign({ id, code:id, name:'', school:'SUT', status:'active' }, SEED_PROGRAMS[id] || {}));
  }
  if(!db.courses.length){
    Object.keys(d.courses).sort(byCode).forEach(code => {
      const c = d.courses[code];
      db.courses.push(newCourse(db, { code, title:c.name || '', programs:(c.programs || []).slice(), school:schoolFor(code), status:'active' }));
    });
  }
  delete d.programs;
  db.programs.forEach((p, i) => {
    const seed = SEED_PROGRAMS[p.id] || {};
    if(!/^#[0-9A-Fa-f]{6}$/.test(p.color || '')) p.color = seed.color || PROG_COLORS[(i*7) % PROG_COLORS.length];
    if(!PROG_ICONS[p.icon]) p.icon = seed.icon || autoIconKey(p.code+' '+(p.name || ''));
  });
  db.courses.forEach(r => { r.electiveIn = (r.electiveIn || []).filter(pid => (r.programs || []).includes(pid)); });
  db.programs.forEach(p => {
    if(p.electiveCount === undefined){
      const e = SEED_ELECTIVES[p.id];
      p.electiveCount = e ? e.count : 0;
      p.scenarios = e ? clone(e.scenarios) : [];
      if(e) db.courses.forEach(r => { if(e.codes.includes(r.code) && (r.programs || []).includes(p.id) && !r.electiveIn.includes(p.id)) r.electiveIn.push(p.id); });
    }
    p.scenarios = p.scenarios || [];
    // A scenario only ever names courses that are electives in this program.
    const pool = electivePool(d, p.id);
    p.scenarios.forEach(sc => { sc.electives = (sc.electives || []).filter(c => pool.includes(c)); });
    if(p.scenarios.length && !p.scenarios.some(sc => sc.primary)) p.scenarios[0].primary = true;
    // 2026-10-06: margin rates on the program; credit what-ifs and snapshots on a
    // scenario, or on the program's required courses when it has no electives.
    const tidy = t => {
      if(t.creditProposals != null){ const o = {}; if(typeof t.creditProposals === 'object') for(const [c, v] of Object.entries(t.creditProposals)) if(typeof v === 'number' && isFinite(v)) o[c] = v; t.creditProposals = o; }
      if(t.snapshots != null && !Array.isArray(t.snapshots)) t.snapshots = [];
    };
    p.scenarios.forEach(tidy);
    if(p.margin != null){
      if(typeof p.margin !== 'object' || Array.isArray(p.margin)) p.margin = {};
      const m = p.margin;
      for(const k of ['tuitionRate','termFee','terms']) if(!(typeof m[k] === 'number' && isFinite(m[k]))) m[k] = null;
      m.basis = m.basis === 'both' ? 'both' : 'sdi'; delete m.source;   // 2026-10-07: Source was retired
      if(m.required != null){ if(typeof m.required !== 'object') m.required = {}; tidy(m.required); }
    }
  });
  db.courses.forEach(r => { r.programs = r.programs || []; r.prereqs = r.prereqs || [];
    if(!d.courses[r.code]) d.courses[r.code] = { code:r.code, name:'', materials:'unknown', programs:[], lists:{}, separateByProgram:false }; });
  Object.keys(d.courses).forEach(code => { if(!db.courses.some(r => r.code === code)) db.courses.push(newCourse(db, { code, title:d.courses[code].name || '', school:schoolFor(code) })); });
  Object.entries(d.courses).forEach(([code, c]) => {
    const recs = db.courses.filter(r => r.code === code);
    c.name = (recs.find(r => r.title) || {}).title || '';
    c.programs = [...new Set(recs.flatMap(r => r.programs))];
  });
}
function validate(d){
  if(!d || d.schema !== 1 || typeof d.items !== 'object' || typeof d.courses !== 'object') throw new Error('That is not a Tools Registry file.');
  const plainId = v => /^[A-Za-z0-9_-]{1,80}$/.test(String(v));
  for(const [k, it] of Object.entries(d.items)){
    if(!plainId(k) || it.id !== k) throw new Error('A tool has an id that is not allowed ('+String(k).slice(0, 40)+').');
    if(!it.name || !String(it.name).trim()) throw new Error('Every tool needs a name.');
    if(it.cost != null && !(typeof it.cost === 'number' && isFinite(it.cost) && it.cost >= 0)) throw new Error('The price for '+it.name+' must be zero or more, or left blank.');
    if(it.adaCost != null && !(typeof it.adaCost === 'number' && isFinite(it.adaCost) && it.adaCost >= 0)) throw new Error('The ADA print price for '+it.name+' must be zero or more, or left blank.');
    if(it.isbn && !isbnOk(it.isbn)) throw new Error('The ISBN for '+it.name+' should be 10 or 13 digits.');
    if(it.printIsbn && !isbnOk(it.printIsbn)) throw new Error('The print ISBN for '+it.name+' should be 10 or 13 digits.');
    if(it.photo && !/^images\/[A-Za-z0-9_-]+\.jpg$/.test(String(it.photo.path || ''))) throw new Error('The picture for '+it.name+' is not where the registry keeps pictures.');
  }
  for(const it of Object.values(d.items)) if(it.weeks != null && (typeof it.weeks !== 'object' || Array.isArray(it.weeks) || Object.values(it.weeks).some(w => !(Number.isInteger(w) && w >= 1 && w <= WEEK_MAX)))) throw new Error('The first weeks/modules for '+it.name+' must be whole weeks/modules from 1 to '+WEEK_MAX+'.');
  for(const it of Object.values(d.items)) if(!Array.isArray(it.usedIn) || it.usedIn.some(c => typeof c !== 'string')) throw new Error('The courses '+it.name+' is used in are not a list of course codes.');
  for(const g of d.duplicates || []) if(!plainId(g.id) || !(g.items || []).every(plainId)) throw new Error('A duplicate group has an id that is not allowed.');
  for(const c of Object.values(d.courses)){
    for(const [k, L] of Object.entries(c.lists || {})){
      const seen = new Set();
      for(const l of L){
        const it = d.items[l.item];
        if(!it) throw new Error(c.code+' points at a tool that is not in the catalog ('+l.item+').');
        if(seen.has(l.item)) throw new Error(it.name+' would be listed twice on '+c.code+'. A course can list a tool only once. Change its quantity instead.');
        seen.add(l.item);
        if(l.qty != null && !(typeof l.qty === 'number' && isFinite(l.qty) && l.qty > 0)) throw new Error('The quantity of '+it.name+' on '+c.code+' must be more than zero.');
      }
    }
  }
  for(const e of clogPosts(d)) if(!/^[A-Za-z0-9_-]{1,80}$/.test(String(e.id)) || !/^\d{4}-\d\d-\d\dT/.test(e.ts)) throw new Error('A changelog post has an id or date that is not allowed.');
  const db = d.courseDb;
  if(db) for(const r of db.courses || []) if(r.category != null && !CRS_CATEGORIES.includes(r.category)) throw new Error('The category for '+r.code+' must be Core, Elective or Gened, or blank.');
  if(db){
    const pids = new Set(), pcodes = new Set(), ids = new Set(), keys = new Set();
    for(const p of db.programs){
      if(!p.code || !String(p.code).trim()) throw new Error('Every program needs a code.');
      if(pcodes.has(normCode(p.code))) throw new Error('Two programs are both called '+p.code+'.');
      if(p.color && !/^#[0-9A-Fa-f]{6}$/.test(p.color)) throw new Error('The color for '+p.code+' is not a valid color.');
      if(p.icon && !PROG_ICONS[p.icon]) throw new Error('The icon for '+p.code+' is not one of the program icons.');
      if(!(Number.isInteger(p.electiveCount) && p.electiveCount >= 0)) throw new Error('The number of electives for '+p.code+' must be a whole number.');
      for(const sc of p.scenarios || []){
        if(!sc.name || !String(sc.name).trim()) throw new Error('Every scenario in '+p.code+' needs a name.');
        if(p.electiveCount && sc.electives.length > p.electiveCount) throw new Error('The scenario “'+sc.name+'” picks '+sc.electives.length+' electives, but '+p.code+' students choose '+p.electiveCount+'.');
      }
      if(!plainId(p.id) || (p.scenarios || []).some(sc => !plainId(sc.id))) throw new Error('A program or scenario in '+p.code+' has an id that is not allowed.');
      const m = p.margin;
      if(m){
        for(const [k, l] of [['tuitionRate','tuition per credit'],['termFee','fee per term']]) if(m[k] != null && !(m[k] >= 0)) throw new Error('The '+l+' for '+p.code+' must be zero or more, or blank.');
        if(m.terms != null && !(Number.isInteger(m.terms) && m.terms >= 1 && m.terms <= 40)) throw new Error('The terms for '+p.code+' must be a whole number from 1 to 40, or blank.');
      }
      for(const t of (p.scenarios || []).concat(m && m.required ? [m.required] : [])){
        for(const [c, v] of Object.entries(t.creditProposals || {})) if(!(v >= 0 && v <= 30)) throw new Error('The modeled credits for '+c+' in '+p.code+' must be from 0 to 30.');

/* ---------------- load ---------------- */
async function loadGitHub(){
  S.mode = 'github'; S.problem = '';
  try{
    S.repoInfo = await ghRepo();
    if(S.repoInfo.permissions && S.repoInfo.permissions.push === false && role().tools.length)
      S.problem = 'This token can read the registry but not save to it.';
    const r = await ghRead();
    if(r.missing){ S.doc = null; S.sha = null; S.missing = true; return {}; }
    const prev = S.doc;
    S.doc = migrate(r.doc); S.sha = r.sha; S.missing = false; S.loadedAt = Date.now(); S.lastCheck = Date.now(); S.remoteNewer = false;
    await kvSet('cache:'+repoLabel(), { doc:S.doc, sha:S.sha, ts:S.loadedAt });
    viewSync();
    return { prev };
  }catch(e){
    if(e.status === 401 && session) S.denied = true;
    // Never block on the feed, never zero it: fall back to the last copy read here.
    if(!S.doc){ const c = await kvGet('cache:'+repoLabel()); if(c && c.doc){ S.doc = migrate(c.doc); S.sha = c.sha; S.loadedAt = c.ts; } }
    S.problem = e.message + (S.doc ? ' Showing the copy this browser last read ('+when(S.loadedAt)+'). Saving is paused until GitHub can be reached.' : '');
    return { error:e };
  }
}
// A viewer reads only the cost-free copy, with the viewer token.
async function loadView(){
  S.mode = 'view'; S.problem = '';
  try{
    const r = await ghRead(null, ACCESS.view, VIEW_FILE);
    if(r.missing){ S.doc = null; S.problem = 'There is nothing to show yet. An editor’s next save fills it in.'; return {}; }
    const prev = S.doc;
    S.doc = migrate(r.doc); S.sha = r.sha; S.loadedAt = Date.now(); S.lastCheck = Date.now(); S.remoteNewer = false;
    await kvSet('cache:view', { doc:S.doc, sha:S.sha, ts:S.loadedAt });
    return { prev };
  }catch(e){
    if(e.status === 401) S.denied = true;
    if(!S.doc){ const c = await kvGet('cache:view'); if(c && c.doc){ S.doc = migrate(c.doc); S.sha = c.sha; S.loadedAt = c.ts; } }
    S.problem = (e.status === 401 ? 'The viewer password has changed. Sign in again with the new one.' : e.message) + (S.doc ? ' Showing the copy this browser last read ('+when(S.loadedAt)+').' : '');
    return { error:e };
  }
}
function loadCurrent(){ return S.mode === 'view' ? loadView() : loadGitHub(); }
async function boot(){
  session = sessLoad(); sessApply();
  if(!session){ gateOpen(location.hash === '#setup' ? 'setup' : location.hash === '#editor' ? 'signin' : 'viewer'); render(); return; }
  gateClose();

  const r = await loadCurrent();

// Someone else saved: an editor gets a notice naming them, with Reload; a
// viewer, who has nothing unsaved, simply gets the newer copy.
async function checkRemote(){
  const gap = S.mode === 'view' ? 120000 : 60000;
  if(!['github', 'view'].includes(S.mode) || !S.doc || S.busy || Date.now() - S.lastCheck < gap) return;
  S.lastCheck = Date.now();
  try{
    const repo = S.mode === 'view' ? ACCESS.view : cfg.repo, file = S.mode === 'view' ? VIEW_FILE : FILE;
    const r = await gh('/contents/'+file+'?ref='+encodeURIComponent(cfg.branch), {}, repo);
    if(!r.ok) return;
    const m = await r.json(); if(m.sha === S.sha) return;
    if(S.mode === 'view'){
      const before = S.doc; await loadView();
      const fresh = clogPosts(S.doc).filter(e => !clogPosts(before).some(x => x.id === e.id));
      render();
      if(fresh.length) toast('New post · '+fresh[0].by+': '+fresh[0].headline, '', { label:'View', run: () => ACT.clog() });
      return;
    }
    try{ const c = await gh('/commits?path='+FILE+'&sha='+encodeURIComponent(cfg.branch)+'&per_page=1'); if(c.ok){ const j = await c.json(); S.remoteBy = j[0] && j[0].commit && j[0].commit.author ? j[0].commit.author.name : ''; } }catch(e){}
    S.remoteNewer = true; renderBanner(); clogPeek();
  }catch(e){}
}
window.addEventListener('focus', checkRemote);
setInterval(checkRemote, 60000);
// Someone else posted: say so, and load it on View.
async function clogPeek(){
  try{
    const r = await readCurrent(); if(r.missing || !r.doc) return;
    const known = new Set(clogPosts(S.doc).map(e => e.id));
    const fresh = clogPosts(r.doc).filter(e => !known.has(e.id) && e.by !== me() && !S.clogToasted.has(e.id));
    if(!fresh.length) return;
    fresh.forEach(e => S.clogToasted.add(e.id));
    toast('New post · '+fresh[0].by+': '+fresh[0].headline+(fresh.length > 1 ? ' (and '+(fresh.length - 1)+' more)' : ''), '', { label:'View', run: async () => { await loadGitHub(); render(); ACT.clog(); } });
  }catch(e){}
}

/* ---------------- save: every change is one commit ---------------- */
// op(doc) edits a copy in place, or returns a whole replacement doc (restore).
// It runs against the newest version: if someone saved in between, the op is
// re-applied on top of their work rather than overwriting it.
function applyOp(doc, op){
  const next = clone(doc);
  const r = op(next);
  const out = migrate(r && typeof r === 'object' ? r : next);
  // A changelog post goes out in the same save as the change it describes,
  // listing exactly what this save changed against the version it lands on.
  if(op.post) clogAdd(out, Object.assign({}, op.post, { headline: op.post.headline || op.message || 'Changes' }), diffRecords(doc, out));
  validate(out);
  out.updatedAt = new Date().toISOString();
  out.updatedBy = user.name || role().label;
  return out;
}
async function save(message, op, after){
  if(op.post) op.message = message;
  if(!canEdit()){ toast(S.problem || 'Saving is not available right now.', 'err'); return false; }
  S.busy = true; renderFoot();
  const who = user.name || role().label;
  try{
    if(!await snapAdd('Before: '+message, S.doc, S.sha)) console.warn('No local snapshot was kept before this save; the GitHub history still has the previous version.');
    if(S.mode === 'local'){
      const next = applyOp(S.doc, op);
      if(!await kvSet('local', { doc:next, ts:Date.now() })) throw new Error('This browser would not store the change. Download a backup now.');
      S.doc = next; S.loadedAt = Date.now();
      toast('Saved in this browser only.');
      if(after) after();
      return true;
    }
    let base = S.doc, baseSha = S.sha, others = [];
    for(let attempt = 1; attempt <= 4; attempt++){
      const next = applyOp(base, op);
      const w = await ghWrite(next, baseSha, message+' (by '+who+')');
      if(!w.conflict){
        S.doc = next; S.sha = w.sha; S.loadedAt = Date.now(); S.lastCheck = Date.now(); S.remoteNewer = false;
        await kvSet('cache:'+repoLabel(), { doc:next, sha:w.sha, ts:S.loadedAt });
        viewSync();
        if(after) after();
        if(others.length) openPanel({ kind:'changes', title:'Saved, and picked up changes someone else made first', lines:others });
        else toast('Saved to GitHub.');
        return true;
      }
      const fresh = await ghRead();
      if(fresh.missing) throw new Error(FILE+' is no longer in the repo, so nothing was saved. Restore it from Backups.');
      const theirs = migrate(fresh.doc);
      others = others.concat(diffDocs(base, theirs));
      base = theirs; baseSha = fresh.sha;
    }
    throw ghErr(409);
  }catch(e){
    toast(e.message || String(e), 'err');
    return false;
  }finally{
    S.busy = false; render();
  }
}

// The viewers' copy follows every save. It is rebuilt from the data that was
// just saved, so a missed write is caught up by the next save or the next
// editor to open the app. Failing never undoes the save itself.
let _viewing = null;
function viewSync(){
  if(S.mode !== 'github' || !session || session.kind !== 'editor' || !S.doc) return Promise.resolve();
  if(_viewing) return _viewing.then(() => viewSync());
  const doc = S.doc, sha = S.sha;
  _viewing = (async () => {
    try{
      let cur = await ghGetJson(ACCESS.view, VIEW_FILE);
      if(!cur.missing && cur.data && cur.data.viewOf && cur.data.viewOf.sha === sha){ S.viewStale = ''; return; }
      for(let i = 0; i < 3; i++){
        const w = await ghPutJson(ACCESS.view, VIEW_FILE, viewDoc(doc, sha), cur.missing ? null : cur.sha, 'Viewer copy of '+(sha || '').slice(0, 7));
        if(!w.conflict){ S.viewStale = ''; return; }
        cur = await ghGetJson(ACCESS.view, VIEW_FILE);
      }
      throw ghErr(409);
    }catch(e){ S.viewStale = e.status === 404 ? 'The viewer repo '+ACCESS.owner+'/'+ACCESS.view+' is missing, or your access doesn’t include it.' : e.message; }
    finally{ _viewing = null; renderBanner(); }
  })();
  return _viewing;
}

function catalogRows(){
  const d = S.doc, f = S.filter;
  let items = Object.values(d.items).filter(i => !i.archived && passes(i));
  if(f && f.startsWith('course:')){ const c = d.courses[f.slice(7)]; const ids = new Set(Object.values(c ? c.lists : {}).flat().map(l => l.item)); items = items.filter(i => ids.has(i.id)); }
  if(f === 'unused') items = items.filter(i => !usage(d, i.id).length);
  if(f === 'dups') items = items.filter(i => openDupFor(d, i.id));
  return items.sort((a, b) => a.name.localeCompare(b.name));
}

/* ----- program list ----- */
// The courses in one program, and the tools each needs for THAT program: a
// course with separate program lists shows this program's list; one shared list
// is shown for every program. Unknown and unpriced never read as zero.
function programCourses(d, pid, show){
  const ff = itemFilter(show);
  const codes = [...new Set(d.courseDb.courses.filter(r => pid === '__none' ? !r.programs.length : r.programs.includes(pid)).map(r => r.code))].sort(byCode);
  return codes.map(code => {
    const c = d.courses[code], recs = d.courseDb.courses.filter(r => r.code === code);
    const title = (recs.find(r => r.title) || {}).title || '';
    const status = recs.every(r => r.status === 'retired') ? 'retired' : recs.some(r => r.status === 'active') ? 'active' : 'draft';
    const out = { code, title, status, credits: recs.map(r => r.credits).find(x => x != null) ?? null, elective: isElective(d, code, pid) };
    const st = courseState(d, c);
    if(st.kind === 'unknown' || st.kind === 'empty') return Object.assign(out, { kind:'unknown', rows:[] });
    if(st.kind === 'none') return Object.assign(out, { kind:'none', rows:[], cost:zeroCost() });
    const L = c.lists[pid] || c.lists['*'] || (Object.keys(c.lists).length === 1 ? Object.values(c.lists)[0] : null);
    if(!L) return Object.assign(out, { kind:'nolist', rows:[] });
    const rows = ff ? L.filter(l => ff(d.items[l.item])) : L, lc = listCost(d, rows);
    if(ff && !rows.length) return Object.assign(out, { kind:'nomatch', rows:[], cost:zeroCost() });
    return Object.assign(out, { kind: lc.unpriced ? 'incomplete' : 'ok', rows, cost:lc, own: !!c.lists[pid] && Object.keys(c.lists).length > 1, conflict: st.kind === 'conflict' });
  });
}
function programTotal(list){
  let cents = 0, open = 0, sdi = 0, student = 0;
  for(const x of list){
    if(x.cost){ cents += Math.round(x.cost.total*100); if(x.cost.sdi){ sdi += Math.round(x.cost.sdi.total*100); student += Math.round(x.cost.student.total*100); } }
    if(x.kind === 'unknown' || x.kind === 'nolist' || x.kind === 'incomplete') open++;
  }
  return { total: cents/100, open, sdi: sdi/100, student: student/100 };
}
// A program's total counts its required courses plus the electives picked.
// Electives not yet picked are "open", like an unpriced tool: the total reads
// open until the choice is complete, and never pretend they cost nothing.
function programSummary(d, pid, show, pick){
  const all = programCourses(d, pid, show), pr = programById(pid, d) || NONE_PROG;
  const required = all.filter(x => !x.elective), pool = all.filter(x => x.elective);
  const chosen = (pick || []).filter(c => pool.some(x => x.code === c));
  const picked = pool.filter(x => chosen.includes(x.code));
  const t = programTotal(required.concat(picked));
  const missing = pool.length && pr.electiveCount ? Math.max(0, pr.electiveCount - chosen.length) : 0;
  const unset = !!pool.length && !pr.electiveCount;   // how many to choose was never set
  return { all, required, pool, picked, chosen, missing, unset, total:t.total, sdi:t.sdi, student:t.student, open:t.open + (missing || unset ? 1 : 0), reqTotal: programTotal(required) };
}
// What this browser has ticked for a program; it starts from the primary scenario.
function currentPick(pr){
  const saved = S.picks[pr.id];
  if(saved) return saved;
  const prim = (pr.scenarios || []).find(x => x.primary);
  return { scenario: prim ? prim.id : null, codes: prim ? prim.electives.slice() : [] };
}
function setPick(pid, v){ S.picks[pid] = v; lsSet('str_picks', S.picks); }
function sameSet(a, b){ return a.length === b.length && a.every(x => b.includes(x)); }

/* ---------------- margin: revenue - COGS over one scenario (2026-10-06) ----------------
   Costs come from the same program list the page totals, so the two never
   disagree. A course code counts once, whichever delivery. A margin is a
   number only when every figure under it is whole: a missing credit, price,
   quantity, tool list or rate withholds it, and the panel says which. */
const MARGIN_DEFAULTS = { tuitionRate:390, termFee:700 };
// Who can open it: roles that see prices, with a token that can write.
function marginOk(){ return !!role().costs && toolViews().length > 0; }
// Defaults are shown, never stored: a blank rate reads the default and says so.
function marginOf(p, draft){
  const m = Object.assign({}, (p && p.margin) || {}, draft || {});
  const num = v => typeof v === 'number' && isFinite(v) ? v : null;
  return { tuitionRate: num(m.tuitionRate) ?? MARGIN_DEFAULTS.tuitionRate, termFee: num(m.termFee) ?? MARGIN_DEFAULTS.termFee,
    terms: num(m.terms), basis: m.basis === 'both' ? 'both' : 'sdi',
    defaults: ['tuitionRate','termFee'].filter(k => num(m[k]) == null) };
}
function basisLabel(b){ return b === 'both' ? 'Everything' : 'SDI supplied'; }
// What a margin is kept on: a saved scenario, or, in a program with no
// electives, its required courses. Unsaved picks have nowhere to keep anything.
function marginTarget(pr, scId){
  if(electivePool(S.doc, pr.id).length) return scId ? (pr.scenarios || []).find(s => s.id === scId) || null : null;
  return (pr.margin && pr.margin.required) || {};
}
function marginTargetIn(doc, pid, scId){
  const p = doc.courseDb.programs.find(x => x.id === pid); if(!p) throw new Error('That program no longer exists.');
  if(scId){ const s = (p.scenarios || []).find(x => x.id === scId); if(!s) throw new Error('That scenario no longer exists.'); return s; }
  p.margin = p.margin || {}; return p.margin.required = p.margin.required || {};
}
// The saved scenario the current picks are, if they are one.
function pickedScenario(pr, pk){ return (pr.scenarios || []).find(x => x.id === pk.scenario && sameSet(x.electives, pk.codes)) || (pr.scenarios || []).find(x => sameSet(x.electives, pk.codes)) || null; }
function marginCalc(d, pr, picks, props, a){
  a = a || marginOf(pr); props = props || {};
  const sm = programSummary(d, pr.id, null, picks || []);
  const rows = sm.required.concat(sm.pool).map(x => {
    const cr = [...new Set(d.courseDb.courses.filter(r => r.code === x.code).map(r => r.credits).filter(v => v != null))];
    const model = typeof props[x.code] === 'number' && isFinite(props[x.code]) ? props[x.code] : null;
    const credits = cr.length === 1 ? cr[0] : null, part = !x.cost ? null : a.basis === 'both' ? x.cost : x.cost.sdi;
    const lines = (x.rows || []).filter(l => a.basis === 'both' || bucketOf(d.items[l.item]) === 'sdi');
    return { code:x.code, title:x.title, elective:x.elective, inn: !x.elective || sm.chosen.includes(x.code), credits, creditsDiffer: cr.length > 1 ? cr : null,
      model, eff: model != null ? model : credits, kind:x.kind, conflict:!!x.conflict, cost: part ? part.total : null, unpriced: part ? part.unpriced : 0,
      noQty: lines.filter(l => l.qty == null).length, lines };
  });
  const on = rows.filter(r => r.inn), why = [];
  const list = (label, f) => { const c = on.filter(f).map(r => r.code); if(c.length) why.push(label+': '+c.join(', ')); };
  if(sm.unset) why.push('Number of electives not set');
  else if(sm.missing) why.push('Electives picked: '+sm.chosen.length+' of '+pr.electiveCount);
  list('No credits', r => r.eff == null && !r.creditsDiffer);
  list('Deliveries disagree on credits', r => r.eff == null && r.creditsDiffer);
  list('Materials unknown', r => r.kind === 'unknown' || r.kind === 'nolist');
  list('No price', r => r.unpriced);
  if(a.terms == null) why.push('Terms not set');
  // Shown with the margin, never in place of it: a blank quantity counts as 1,
  // and a course whose programs list different tools uses this program's list,
  // the same list the program page totals.
  const flags = [];
  const flag = (label, f) => { const c = on.filter(f).map(r => r.code); if(c.length) flags.push(label+': '+c.join(', ')); };
  flag('Quantity counted as 1', r => r.noQty);
  flag('This program’s own tool list', r => r.conflict);
  const okCr = !on.some(r => r.eff == null), okFee = a.terms != null;
  const okCogs = !on.some(r => r.kind === 'unknown' || r.kind === 'nolist' || r.unpriced);
  const credits = Math.round(on.reduce((s, r) => s + (r.eff || 0), 0)*100)/100;
  const cogsC = on.reduce((s, r) => s + Math.round((r.cost || 0)*100), 0);
  const tuitionC = Math.round(a.tuitionRate*100*credits), feesC = okFee ? Math.round(a.termFee*100)*a.terms : 0, revC = tuitionC + feesC;
  if(okCr && okFee && revC <= 0) why.push('Revenue is $0');
  const complete = !why.length;
  return { a, sm, rows, why, flags, complete,
    credits: okCr ? credits : null, tuition: okCr ? tuitionC/100 : null, fees: okFee ? feesC/100 : null,
    revenue: okCr && okFee ? revC/100 : null, cogs: okCogs ? cogsC/100 : null,
    gross: complete ? (revC - cogsC)/100 : null, grossPct: complete ? (revC - cogsC)/revC : null, cogsPct: complete ? cogsC/revC : null,
    modeled: on.filter(r => r.model != null).map(r => r.code), qtyOne: on.filter(r => r.noQty).map(r => r.code) };
}
function marginDiff(out, label, x, y){
  const pa = x.creditProposals || {}, pb = y.creditProposals || {};
  for(const c of [...new Set(Object.keys(pa).concat(Object.keys(pb)))].sort(byCode)) if(pa[c] !== pb[c]) out.push(label+': '+(pb[c] == null ? c+' modeled credits cleared' : 'model '+c+' at '+pb[c]+' credits'+(pa[c] != null ? ' (was '+pa[c]+')' : '')));
  const sa = new Set((x.snapshots || []).map(s => s.id)), sb = new Set((y.snapshots || []).map(s => s.id));
  for(const s of y.snapshots || []) if(!sa.has(s.id)) out.push(label+': snapshot '+s.on+' at '+pct(s.grossPct));
  for(const s of x.snapshots || []) if(!sb.has(s.id)) out.push(label+': deleted snapshot of '+s.on);
}
function pct(v){ return v == null ? '—' : (v*100).toFixed(1)+'%'; }
// A snapshot keeps the figures and everything that made them: rates,
// basis, each course's credits and cost, and each tool's price. It is never
// recalculated. An incomplete margin is never snapshotted.
function marginSnapshot(d, m){
  if(!m.complete) return null;
  return { id:'snap-'+Date.now().toString(36), on: today(), by: user.name || role().label,
    basis:m.a.basis, tuitionRate:m.a.tuitionRate, termFee:m.a.termFee, terms:m.a.terms, defaults:m.a.defaults.slice(), qtyOne:(m.qtyOne || []).slice(),
    credits:m.credits, tuition:m.tuition, fees:m.fees, revenue:m.revenue, cogs:m.cogs, grossPct:m.grossPct, modeled:m.modeled.slice(),
    courses: m.rows.filter(r => r.inn).map(r => ({ code:r.code, credits:r.eff, modeled: r.model != null, cost: r.cost || 0,
      tools: r.lines.map(l => ({ item:l.item, name:(d.items[l.item] || {}).name || l.item, qty:l.qty, price:(d.items[l.item] || {}).cost ?? null })) })) };

// How today's figures differ from a snapshot, on the snapshot's own basis.
function snapshotDiff(d, pr, snap, picks, props){
  const live = marginCalc(d, pr, picks, props, Object.assign(marginOf(pr), { basis:snap.basis }));
  const out = [], sgn = n => (n > 0 ? '+' : '−')+money(Math.abs(n));
  if(!live.complete) out.push('Now withheld');
  else {
    if(Math.round(live.revenue*100) !== Math.round(snap.revenue*100)) out.push('Revenue '+sgn(live.revenue - snap.revenue));
    if(Math.round(live.cogs*100) !== Math.round(snap.cogs*100)) out.push('COGS '+sgn(live.cogs - snap.cogs));
  }
  const a = live.a;
  if(a.tuitionRate !== snap.tuitionRate) out.push('Per credit '+money(snap.tuitionRate)+' → '+money(a.tuitionRate));
  if(a.termFee !== snap.termFee) out.push('Per term '+money(snap.termFee)+' → '+money(a.termFee));
  if(a.terms !== snap.terms) out.push('Terms '+snap.terms+' → '+(a.terms ?? 'not set'));
  const now = new Map(live.rows.filter(r => r.inn).map(r => [r.code, r])), was = new Map(snap.courses.map(c => [c.code, c]));
  for(const [c] of now) if(!was.has(c)) out.push('Added '+c);
  for(const [c, x] of was){
    const r = now.get(c); if(!r){ out.push('Removed '+c); continue; }
    if(r.eff !== x.credits) out.push(c+' credits '+x.credits+' → '+(r.eff ?? 'none'));
    for(const t of x.tools){ const it = d.items[t.item]; const p = it ? it.cost ?? null : null; if(p !== t.price) out.push(t.name+' '+(t.price == null ? 'no price' : money(t.price))+' → '+(p == null ? 'no price' : money(p))); }
  }
  const lines = [...new Set(out)];
  return { live, lines, differs: !!lines.length, now: live.complete ? live.grossPct : null };
}

/* ----- the tool map, for a program or for one course ----- */
// One row per tool, one column per course. A tool is bought where a course lists
// it (its cost counts there) and used, at no added cost, where it is carried into.
// cols: [{ code, elective, dim, here, lines }]; ids: the tools to show.
function mapRows(d, cols, ids){
  const ff = filterFn();
  return [...ids].map(id => d.items[id]).filter(it => it && !it.archived && (!ff || ff(it))).map(it => {
    const cells = cols.map(c => c.lines.some(l => l.item === it.id) ? 'buy' : (it.usedIn || []).includes(c.code) ? 'use' : '');
    const priced = cols.filter(c => c.priced !== false);
    const cost = priced.reduce((s, c) => s + c.lines.filter(l => l.item === it.id).reduce((a, l) => a + (it.cost == null ? 0 : Math.round(it.cost*100)*(l.qty ?? 1)), 0), 0)/100;
    return { it, cells, cost, reused: cells.includes('use') };
  });
}
// Keep only the columns something touches, and order the rows by where each tool starts.
function mapTrim(cols, rows){

  rows.forEach(r => { r.cells = r.cells.filter((x, i) => keep[i]); r.first = r.cells.findIndex(x => x); });
  rows.sort((a, b) => a.first - b.first || a.it.name.localeCompare(b.it.name));

/* ----- the weekly tool map: when each course's tools are first used ----- */
// One row per course, one column per week of the course. A tool sits in the week
// it is first used there; a tool with no week sits under No week and is never
// counted as week 0. Courses run on their own weeks: there is no program calendar.
function weekMap(d, pr, shown){
  const ff = filterFn(), sdi = S.wkSdi, courses = [];
  let W = 0;
  for(const x of shown){
    const o = { code:x.code, title:x.title, elective:x.elective, kind:x.kind, tools:[] };
    // Tools carried in show even on a course whose own list is not known yet.
    const items = (x.rows || []).map(l => d.items[l.item]).filter(Boolean).map(it => ({ it, use:false }))
      .concat(carriedInto(d, x.code).filter(it => !ff || ff(it)).map(it => ({ it, use:true })));
    o.tools = items.filter(t => !sdi || t.it.supplied !== 'student').map(t => Object.assign(t, { week: weekOf(t.it, x.code) })).sort((a, b) => a.it.name.localeCompare(b.it.name));
    Object.assign(o, firstWeek(o.tools.map(t => t.it), x.code));
    // The map is as long as its longest course: 5 for a 5-week/module course,
    // 8 for an 8. Weeks/modules past a course's own length are shaded.
    o.len = courseLength(d, x.code);
    W = Math.max(W, o.len || 0, ...o.tools.map(t => t.week || 0));
    courses.push(o);
  }
  // With no course length set anywhere, 8 as before.
  if(!courses.some(o => o.len)) W = Math.max(W, 8);
  return { courses, W, title: pr.code+(pr.name ? ' · '+pr.name : ''), slug: pr.code, sdi };
}

  const W = PAD*2 + CRS + (m.W + 1)*COL, H = PAD + TOP + HEAD + rowsH.reduce((a, b) => a + b, 0) + LEG;

  g += '<line x1="'+PAD+'" x2="'+(W-PAD)+'" y1="'+(y0+HEAD-4)+'" y2="'+(y0+HEAD-4)+'" stroke="#101820" stroke-width="2"/>';

      '<text x="'+PAD+'" y="'+(y+31)+'" font-family="'+F+'" font-size="11" fill="#6E6E69">'+esc(cut(o.title || '', 38))+'</text>'+
      '<text x="'+PAD+'" y="'+(y+45)+'" font-family="'+F+'" font-size="11" font-weight="700" fill="'+(o.tools.length && o.first && !o.unset ? '#AB0028' : '#7A4A00')+'">'+esc(fw)+'</text>';

    for(let i = 0; i <= m.W; i++){

// Keeps the conditional parts of the form in step with its checkboxes.
function syncToolForm(px){
  const on = id => { const e = $('#'+px+id); return !!(e && e.checked); }, show = (id, v) => { const e = $('#'+px+id); if(e) e.hidden = !v; };
  const book = on('Book');

function readToolForm(px){
  const v = id => { const e = $('#'+px+id); return e ? e.value.trim() : ''; };
  const on = id => { const e = $('#'+px+id); return !!(e && e.checked); };
  const radio = n => (document.querySelector('input[name="'+px+n+'"]:checked') || {}).value;
  const book = on('Book'), isbn = isbnClean(v('Isbn')), printIsbn = isbnClean(v('PrintIsbn')), brand = v('Brand'), brandRequired = on('BrandReq');
  const f = { name: v('Name'), generic: v('Generic'), brand, brandRequired, type: book ? 'textbook' : (v('Type') || 'equipment'), isbn, edition: v('Edition'), vbid: v('Vbid'), printIsbn, adaPrint: on('Ada'), supplied: on('Sup') ? 'student' : 'sdi',
    kind: radio('Kind') || '', vendor: v('Vendor'), link: v('Link'), sku: v('Sku'), sdiSku: v('SdiSku'), notes: v('Notes'),
    usedIn: on('Reuse') ? [...document.querySelectorAll('input[name="'+px+'Used"]:checked:not(:disabled)')].map(e => e.value).sort(byCode) : [] };
  // The ADA print price is kept for reference and never counted in a total.
  const ac = $('#'+px+'AdaCost');
  if(ac){ const raw = ac.value.trim().replace(/[$,\s]/g, ''); f.adaCost = raw === '' ? null : Math.round(Number(raw)*100)/100; if(raw !== '' && !(isFinite(f.adaCost) && f.adaCost >= 0)) throw new Error('The ADA print price must be a number, or blank.'); }
  if(!f.name) throw new Error('A tool needs a name.');
  if(isbn && !isbnOk(isbn)) throw new Error('That ISBN doesn’t look right. It should be 10 digits, or 13 starting 978 or 979.');
  if(printIsbn && !isbnOk(printIsbn)) throw new Error('That print ISBN doesn’t look right. It should be 10 digits, or 13 starting 978 or 979.');
  if(brandRequired && !brand) throw new Error('Type the brand that’s required in the Brand field.');
  return f;
}

function bigrams(s){ const out = new Map(); for(let i = 0; i < s.length-1; i++){ const g = s.slice(i, i+2); out.set(g, (out.get(g) || 0)+1); } return out; }
function similar(a, b){
  a = norm(a); b = norm(b); if(!a || !b) return 0; if(a === b) return 1;
  if(a.length >= 4 && (b.includes(a) || a.includes(b))) return 0.9;
  const A = bigrams(a), B = bigrams(b); let inter = 0;
  for(const [g, n] of A) inter += Math.min(n, B.get(g) || 0);
  return 2*inter / Math.max(1, (a.length-1)+(b.length-1));
}
