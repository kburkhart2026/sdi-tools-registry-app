// The registry's current lists for one school, in the workbook's shape.
// Programs a school has before any of them are in the registry, so its
// workbook starts with their codes. Names and directors are filled in there.
const SCHOOL_PROGRAMS = { SFT:['ASFT', 'CFTG', 'CFTHS'] };
function schoolWorkbook(d, school){
  const db = d.courseDb, progs = db.programs.filter(p => p.school === school);
  const pids = new Set(progs.map(p => p.id)), pc = id => (db.programs.find(p => p.id === id) || { code:id }).code;
  const codes = [...new Set(db.courses.filter(r => r.programs.some(p => pids.has(p))).map(r => r.code))].sort(byCode);
  const tools = [], courses = [];
  const row = (cols, o) => cols.map(c => o[c.k] ?? null);
  for(const code of codes){
    const c = d.courses[code], recs = db.courses.filter(r => r.code === code), first = k => (recs.find(r => r[k] != null && r[k] !== '' && !(Array.isArray(r[k]) && !r[k].length)) || {})[k];
    const pids2 = [...new Set(recs.flatMap(r => r.programs))], el = [...new Set(recs.flatMap(r => r.electiveIn || []))].filter(id => pids2.includes(id));
    courses.push(row(TPL_CRS_COLS, { code, title:first('title') || '', credits:first('credits'), weeks:first('weeks'), category:first('category'),
      status:(CRS_STATUSES.find(x => x.id === (recs.find(r => r.status === 'active') || recs[0] || {}).status) || {}).label, progs:pids2.map(pc).join(', '), elective:el.map(pc).join(', ') || null,
      prereqs:(first('prereqs') || []).join(', ') || null, none: c && c.materials === 'none' ? 'Yes' : null }));
    const seen = new Set();
    for(const L of Object.values(c ? c.lists : {})) for(const l of L){
      if(seen.has(l.item)) continue; seen.add(l.item);
      const it = d.items[l.item];
      tools.push(row(TPL_TOOL_COLS, { code, name:it.name, generic:it.generic || null, qty:l.qty, week:weekOf(it, code), cost:it.cost, type:tplTypeLabel(it.type), isbn:it.isbn || null, edition:it.edition || null, vbid:it.vbid || null, printIsbn:it.printIsbn || null,
        ada: it.type === 'textbook' ? (it.adaPrint ? 'Yes' : 'No') : null, adaCost: it.adaCost ?? null, student: it.supplied === 'student' ? 'Yes' : 'No', kind:kindLabel(it.kind) || null, brand:it.brand || null, brandReq: it.brandRequired ? 'Yes' : 'No',
        vendor:it.vendor || null, sku:it.sku || null, sdiSku:it.sdiSku || null, link:it.link || null, usedIn:(it.usedIn || []).join(', ') || null, notes:it.notes || null, id:it.id }));
    }
  }
  const have = new Set(progs.map(p => normCode(p.code)));
  const seeded = (SCHOOL_PROGRAMS[school] || []).filter(c => !have.has(normCode(c))).map(c => [c, null, null, null]);
  return toolListWorkbook({ school, prepared:user.name || '', programs:progs.map(p => [p.code, p.name || '', '', p.electiveCount || 0]).concat(seeded), courses, tools });
}

// ---- reading a returned workbook into plain rows ----
const hdrKey = s => String(s == null ? '' : s).replace(/\*/g, '').trim().toLowerCase();
function cellStr(v){ return v == null ? '' : typeof v === 'number' ? String(Math.round(v * 1e6) / 1e6) : String(v).trim(); }
function readToolList(book){
  const sh = book.sheets, fatal = [];
  const tab = n => Object.keys(sh).find(k => k.trim().toLowerCase() === n.toLowerCase());
  for(const n of ['School', 'Programs', 'Tools']) if(!tab(n)) fatal.push('The '+n+' tab is missing.');
  if(fatal.length) return { fatal };
  const ins = sh[tab('Instructions')] || [], ver = (ins.find(r => hdrKey(r[0]) === 'template version') || [])[1];
  if(ver != null && ![1, TPL_VERSION].includes(Number(ver))) fatal.push('This workbook is template version '+ver+'. Download a new template.');
  const sc = sh[tab('School')], field = n => cellStr((sc.find(r => hdrKey(r[0]) === n) || [])[1]);
  const school = field('school').toUpperCase(), prepared = field('prepared by');
  if(!school) fatal.push('School is blank on the School tab.');
  else if(!TPL_SCHOOLS.includes(school)) fatal.push('School '+school+' is not '+TPL_SCHOOLS.join(' or ')+'.');
  const cols = (rows, spec, tabName) => {
    const head = (rows[0] || []).map(hdrKey), at = {};
    for(const c of spec){ let i = head.indexOf(c.h.toLowerCase()); if(i < 0 && c.alt) i = head.indexOf(c.alt.toLowerCase()); if(i < 0){ if(c.req || ['name', 'qty', 'cost', 'type', 'isbn', 'student', 'kind', 'brand', 'brandReq', 'vendor', 'sku', 'link', 'usedIn', 'notes'].includes(c.k) && tabName === 'Tools') fatal.push('The '+tabName+' tab has no '+c.h+' column.'); } else at[c.k] = i; }
    return at;
  };
  const body = (rows, at) => rows.slice(1).map((r, i) => { const o = { row:i + 2, raw:r.slice() }; for(const [k, j] of Object.entries(at)) o[k] = r[j] == null ? null : r[j]; return o; })
    .filter(o => Object.keys(at).some(k => o[k] != null && cellStr(o[k]) !== ''));
  const pa = cols(sh[tab('Programs')], TPL_PROG_COLS, 'Programs'), ta = Object.assign(cols(sh[tab('Tools')], TPL_TOOL_COLS, 'Tools'), cols(sh[tab('Tools')], TPL_LEGACY_COLS, 'Tools'));
  const ca = tab('Courses') ? cols(sh[tab('Courses')], TPL_CRS_COLS, 'Courses') : null;
  if(fatal.length) return { fatal };
  const programs = body(sh[tab('Programs')], pa), tools = body(sh[tab('Tools')], ta), courses = ca ? body(sh[tab('Courses')], ca) : [];
  if(!tools.length && !courses.length) fatal.push('The Courses and Tools tabs have no rows.');
  return { fatal, school, prepared, programs, courses, tools, progHead:TPL_PROG_COLS.length, toolHead:TPL_TOOL_COLS.length };
}

// ---- the import plan ----
// Everything the import will do, worked out against doc. P holds the choices
// made in the panel; any choice not made yet takes its default. Nothing here
// changes doc, so the plan can be shown, and the same plan re-made on top of
// someone else's save.
const normName = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const nameTokens = s => new Set(normName(s).split(' ').filter(Boolean));
function nameSim(a, b){ const A = nameTokens(a), B = nameTokens(b); let n = 0; A.forEach(t => { if(B.has(t)) n++; }); return n < 2 ? 0 : n / (A.size + B.size - n); }
const splitCodes = v => cellStr(v).split(/[,;\n]+/).map(s => normCode(s)).filter(Boolean);
const yes = v => /^(y|yes|true|x|1)$/i.test(cellStr(v));

    }
  }
  k.newTools = usedNew.size;
  k.skipped = out.rows.filter(x => !good(x)).length;
  out.issues.forEach(i => { i.resolved = !!(i.pick && i.sev === 'e' && out.picks[i.pick.key] !== i.pick.def); });
  k.errs = out.issues.filter(i => i.sev === 'e' && !i.resolved).length;
  k.warns = out.issues.filter(i => i.sev === 'w').length + out.courses.filter(o => o.pickKey).length;
  k.newProgs = out.programs.filter(p => p.ok && !p.existing).length;
  k.fill = out.courses.filter(o => !o.bad && o.existing && (Object.keys(o.fill).length || o.addProgs.length)).length;
  out.k = k;
  out.good = good;
  return out;
}
// Carries out the plan on doc. It runs inside save(), so on a conflict it is
// worked out again on top of the other person's change.
function importApply(doc, book, P, fileName, who){
  const plan = importPlan(doc, book, Object.assign({}, P));
  if(plan.fatal.length) throw new Error(plan.fatal[0]);
  const db = doc.courseDb, on = today(), src = r => 'import: '+fileName+' Tools!'+r;
  const pid = {};
  plan.programs.filter(p => p.ok).forEach(p => {
    if(p.existing){ pid[p.code] = p.existing; return; }
    let id = 'prog-'+p.code.toLowerCase().replace(/[^a-z0-9]/g, ''), n = 2;
    while(db.programs.some(x => x.id === id)) id = id.replace(/-\d+$/, '')+'-'+(n++);
    db.programs.push({ id, code:p.code, name:p.name, school:plan.school, status:'active', electiveCount:p.el, scenarios:[], color:PROG_COLORS[(db.programs.length*7) % PROG_COLORS.length], icon:autoIconKey(p.code+' '+p.name) });
    pid[p.code] = id;
  });
  const realPid = id => id.startsWith('new:') ? pid[id.slice(4)] : id;
  // New catalog tools, only those some imported line uses.
  const newId = {};
  const need = new Set();
  plan.courses.forEach(o => { if(!o.bad) o.lines.forEach(l => { if(l.k === 'a' && !l.item && impApplies(o.mode, 'a')) need.add(l.x.newKey); }); });
  for(const t of plan.newTools){
    if(!need.has(t.key)) continue;
    const x = t.first, cost = x.cost ?? (t.rows.find(r => r.cost != null) || {}).cost ?? null;
    const id = 'T'+String(doc.nextItem).padStart(3, '0'); doc.nextItem++;
    doc.items[id] = { id, name:x.name, generic:x.generic, brand:x.brand, brandRequired:x.brandRequired, type:x.type || 'equipment', isbn:x.isbn, edition:x.edition, vbid:x.vbid, printIsbn:x.printIsbn, adaPrint:x.adaPrint, adaCost:x.adaCost, supplied:x.supplied, kind:x.kind,
      vendor:x.vendor, link:x.link, sku:x.sku, sdiSku:x.sdiSku || '', notes:x.notes, cost, costConfirmed:false,
      costHistory: cost == null ? [] : [{ cost, on, by:who, source:src(x.row) }], archived:false, addedBy:who, addedOn:on, usedIn:[] };
    newId[t.key] = id;
  }
  const itemOf = l => l.item || newId[l.x.newKey];
  // Prices on catalog tools the file changes.
  for(const [k, v] of Object.entries(plan.picks)){
    if(!k.startsWith('price:') || v !== 'file') continue;
    const id = k.slice(6), x = plan.rows.find(r => r.priceFrom === id), it = doc.items[id];
    if(!x || !it || it.cost === x.cost) continue;
    it.cost = x.cost; it.costConfirmed = false; it.costHistory.push({ cost:x.cost, on, by:who, source:src(x.row) });
  }
  // Courses.
  for(const o of plan.courses){
    if(o.bad) continue;
    const progs = o.progIds.map(realPid).filter(Boolean);
    if(!o.existing){
      const school = schoolFor(o.code) === 'Geneds' ? 'Geneds' : plan.school;
      db.courses.push(newCourse(db, { code:o.code, title:o.title, category:o.category, programs:progs, school, status:o.status || 'draft',
        credits:o.credits, weeks:o.weeks, prereqs:o.prereqs.slice(), electiveIn:o.electIds.map(realPid).filter(id => progs.includes(id)) }));
      doc.courses[o.code] = { code:o.code, name:o.title, materials: o.none && !o.lines.length ? 'none' : 'unknown', programs:progs.slice(), lists:{}, separateByProgram:false };
    }
    if(o.existing){
      const recs = db.courses.filter(r => r.code === o.code);
      for(const k of ['credits', 'weeks', 'prereqs']) if(k in o.fill) recs.forEach(r => { r[k] = clone(o.fill[k]); if(k === 'weeks') r.deliveryLabel = r.weeks ? r.weeks+'-week' : ''; });
      if(o.fill.none) doc.courses[o.code].materials = 'none';
    }
    // A category from the workbook fills a blank one; it never overwrites.
    if(o.existing && o.category) db.courses.filter(r => r.code === o.code && !r.category).forEach(r => { r.category = o.category; });
    if(o.existing && o.addProgs.length){
      const recs = db.courses.filter(r => r.code === o.code), add = o.addProgs.map(realPid).filter(Boolean);
      const el = o.addElect.map(realPid).filter(Boolean);
      recs.forEach(r => { r.programs = [...new Set(r.programs.concat(add))]; r.electiveIn = [...new Set((r.electiveIn || []).concat(el))]; });
    }
    const c = doc.courses[o.code];
    if(o.separate) continue;
    const L = c.lists['*'] = c.lists['*'] || [];
    for(const l of o.lines){
      if(l.k === 's' || !impApplies(o.mode, l.k)) continue;
      const id = itemOf(l);
      if(l.k === 'a'){ if(!L.some(y => y.item === id)) L.push({ item:id, qty:l.qty }); }
      else if(l.k === 'c'){ const y = L.find(y => y.item === id); if(y) y.qty = l.qty; }
      else { const i = L.findIndex(y => y.item === id); if(i >= 0) L.splice(i, 1); }
    }
    if(L.length) c.materials = 'listed';
  }
  // Also used in, for the lines that went in.
  for(const o of plan.courses){
    if(o.bad) continue;
    for(const l of o.lines){
      if(!l.x || !(l.k === 's' || impApplies(o.mode, l.k))) continue;
      const it = doc.items[itemOf(l)];
      if(it && l.k !== 's' && l.week != null && l.week !== l.wasWeek){ it.weeks = Object.assign({}, it.weeks); it.weeks[o.code] = l.week; }
      if(it && l.x.usedOk.length) it.usedIn = [...new Set((it.usedIn || []).concat(l.x.usedOk))].sort(byCode);
    }
  }
  return plan;
}
// The file sent back to the Program Director: their rows, and what each needs.
function returnWorkbook(book, plan){
  const flags = { tools:[], programs:[] };
  const held = new Set();
  plan.courses.forEach(o => { if(o.existing && o.mode === 'leave') o.lines.forEach(l => { if(l.x && l.k !== 's') held.add(l.x.row); }); });
  const at = loc => plan.issues.filter(i => i.sev !== 'i' && i.loc.split(', ').includes(loc));
  book.tools.forEach((r, i) => {
    const L = at('Tools!'+r.row), x = plan.rows.find(y => y.row === r.row), err = x && !plan.good(x);
    const text = L.filter(l => !l.resolved).map(l => l.t).concat(held.has(r.row) ? [cellStr(r.code)+' left as is in the registry'] : []);
    flags.tools[i] = text.length ? { err, text:text.join('; ') } : null;
  });
  book.programs.forEach((r, i) => { const L = at('Programs!'+r.row); flags.programs[i] = L.length ? { err:L.some(l => l.sev === 'e'), text:L.map(l => l.t).join('; ') } : null; });
  // A version 1 workbook had its courses on the tool rows; the return file gives them their own tab.
  const pc = id => id.startsWith('new:') ? id.slice(4) : ((S.doc && programById(id)) || { code:id }).code;
  const courses = (book.courses || []).length ? book.courses.map(r => TPL_CRS_COLS.map(c => r[c.k] ?? null))
    : plan.courses.map(o => TPL_CRS_COLS.map(c => ({ code:o.code, title:o.title || null, category:o.category, progs:o.progIds.map(pc).join(', ') || null })[c.k] ?? null));
  flags.courses = (book.courses || []).map(r => { const L = at('Courses!'+r.row); return L.length ? { err:L.some(l => l.sev === 'e'), text:L.map(l => l.t).join('; ') } : null; });
  return toolListWorkbook({ school:book.school, prepared:book.prepared, flags, courses,
    programs:book.programs.map(r => TPL_PROG_COLS.map(c => r[c.k] ?? null)), tools:book.tools.map(r => TPL_TOOL_COLS.map(c => r[c.k] ?? null)) });
}

function downloadBlob(name, bytes, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type }));

  const table = rows => '<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="0" w:type="auto"/><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(e => '<w:'+e+' w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>').join('')+'</w:tblBorders>'+
    '<w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+W.map(w => '<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>'+

  const hs = (id, name, size, before, after, lvl) => '<w:style w:type="paragraph" w:styleId="'+id+'"><w:name w:val="'+name+'"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:uiPriority w:val="9"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="'+before+'" w:after="'+after+'"/><w:outlineLvl w:val="'+lvl+'"/></w:pPr><w:rPr><w:b/><w:sz w:val="'+size+'"/></w:rPr></w:style>';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  return zipWrite([
    { name:'[Content_Types].xml', data:X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>' },

    { name:'word/document.xml', data:X+'<w:document '+NS+'><w:body>'+body+'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>' },
    { name:'word/styles.xml', data:X+'<w:styles '+NS+'><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120"/></w:pPr></w:pPrDefault></w:docDefaults>'+
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'+hs('Heading1','heading 1',32,0,160,0)+hs('Heading2','heading 2',26,280,120,1)+hs('Heading3','heading 3',22,220,80,2)+

      '<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/><w:basedOn w:val="TableNormal"/></w:style></w:styles>' },
  ]);
}
// One table row per tool: its generic name, who supplies it, and the other
// courses (within scope) that buy it or use it. A blank cell reads n/a.
function docRows(d, code, items, scope){
  return items.map(it => {
    const other = [...new Set(boughtIn(d, it.id).concat(it.usedIn || []))].filter(c => c !== code && (!scope || scope.includes(c))).sort(byCode);
    const book = it.type === 'textbook' ? '\n'+['Edition: '+(it.edition || 'n/a'), 'ISBN: '+(it.isbn || 'n/a'), 'VBID: '+(it.vbid || 'n/a'), 'Print ISBN: '+(it.printIsbn || 'n/a'), 'ADA print: '+(it.adaPrint ? 'Yes' : 'No')].join(' · ') : '';
    return [(genericName(it) || 'n/a')+book, supLabel(it.supplied), weekText(weekOf(it, code)) || 'n/a', other.join(', ') || 'n/a'];
  });
}
function docEmpty(d, code, ff){
  const c = d.courses[code];
  if(ff && c && Object.values(c.lists).some(L => L.length)) return 'n/a';
  return c && c.materials === 'none' ? 'No materials' : 'Tools not listed';
}
function programDocBlocks(d, pr, ff){
  const all = programCourses(d, pr.id, ff).filter(x => x.status !== 'retired'), scope = all.map(x => x.code);
  const B = [['h1', pr.code+(pr.name ? ' · '+pr.name : '')]];
  const groups = [['Required courses', all.filter(x => !x.elective)], ['Electives'+(pr.electiveCount ? ' · choose '+pr.electiveCount : ''), all.filter(x => x.elective)]];
  for(const [label, list] of groups){
    if(!list.length) continue;
    B.push(['h2', label]);
    for(const x of list){
      B.push(['h3', x.code+(x.title ? ' · '+x.title : '')]);
      const items = x.rows.map(l => d.items[l.item]).concat(carriedInto(d, x.code).filter(it => !ff || ff(it)));
      B.push(items.length ? ['table', docRows(d, x.code, items, scope)] : ['p', x.kind === 'none' ? 'No materials' : x.kind === 'nomatch' ? 'n/a' : docEmpty(d, x.code, ff)]);
    }
  }
  return B;
}

// While a lock opens (a second or two), the button says so; the form is not redrawn.
async function gateBusy(form, label, fn){
  const b = form.querySelector('button[type=submit]'), was = b.textContent; b.disabled = true; b.textContent = label;
  try{ await fn(); }
  catch(e){ G.err = e.message || String(e); b.disabled = false; b.textContent = was; const x = $('#gate .gerr'); if(x) x.textContent = G.err; else { const d = document.createElement('div'); d.className = 'gerr'; d.textContent = G.err; form.parentNode.insertBefore(d, form); } }
}
function pwCheck(a, b){ if(a.length < MIN_PW) throw new Error('Use at least '+MIN_PW+' characters.'); if(a !== b) throw new Error('The two passwords don’t match.'); }
// What a token can reach: HTTP status per repo, and its expiry if GitHub says.
async function tokenReach(tok){
  const out = {};
  for(const k of ['data', 'view', 'app']){
    const r = await gh('', {}, ACCESS[k], tok); out[k] = r.status;
    const x = r.headers.get('github-authentication-token-expiration'); if(x && !out.expires){ const t = Date.parse(x); if(t) out.expires = new Date(t).toISOString(); }
  }
  return out;
}
function editorTokenOk(r){
  const miss = ['data', 'view', 'app'].filter(k => r[k] !== 200);
  if(r.data === 401) throw new Error('GitHub doesn’t accept that token. Check it was copied in full.');
  if(miss.length) throw new Error('That token can’t open '+miss.map(k => ACCESS[k]).join(', ')+'. Edit the token on GitHub and add '+(miss.length === 1 ? 'that repo' : 'those repos')+'.');
}
// editors.json, changed and written back; a clash with another write retries.
async function editorsWrite(mut, message, tok){
  for(let i = 0; i < 3; i++){
    const cur = await ghGetJson(ACCESS.app, EDITORS_FILE, tok);
    const data = cur.missing ? { v:1, editors:[] } : cur.data; data.editors = Array.isArray(data.editors) ? data.editors : [];
    mut(data);
    const w = await ghPutJson(ACCESS.app, EDITORS_FILE, data, cur.missing ? null : cur.sha, message, tok);
    if(!w.conflict) return data;
  }
  throw ghErr(409);
}

async function edLoad(){
  S.ed = { list:[], last:{}, loading:true };
  try{
    const [e, v] = await Promise.all([ghGetJson(ACCESS.app, EDITORS_FILE), ghGetJson(ACCESS.app, VKEY_FILE)]);
    const last = {};
    try{ (await ghCommits()).forEach(c => { const n = c.commit && c.commit.author && c.commit.author.name, d = c.commit && c.commit.author && c.commit.author.date; if(n && d && !last[n]) last[n] = d; }); }catch(x){}
    S.ed = { list: e.missing ? [] : (e.data.editors || []), last, vkey: v.missing ? null : v.data };
  }catch(x){ S.ed = { err: x.status === 404 ? 'Your access doesn’t include '+ACCESS.app+'.' : x.message }; }
  if(S.panel && S.panel.kind === 'editors') renderPanel();
}

async function edIssue(f, name, isNew){
  const tok = $('#edTok').value.trim(); if(!tok) throw new Error('Paste the token.');
  const reach = await tokenReach(tok); editorTokenOk(reach);
  const code = setupCode(), lock = await vaultLock(tok, code), expires = reach.expires || dateIso($('#edExp').value);
  const data = await editorsWrite(d => {
    const x = d.editors.find(y => y.name === name);
    if(isNew && x) throw new Error(name+' is already an editor.');
    if(!isNew && !x) throw new Error(name+' is no longer on the list.');
    const entry = { name, admin: !!(x && x.admin), state:'setup', lock, added: x ? x.added : new Date().toISOString(), expires };
    if(x) Object.assign(x, entry, { setAt:undefined }); else d.editors.push(entry);
  }, (isNew ? 'Add editor ' : 'Reset editor ')+name);
  S.ed.list = data.editors; S.panel.reset = null; S.panel.code = { name, code };
  renderPanel();
}

ACT.vkSet = f => gateBusy(f, 'Checking…', async () => {
  const tok = $('#vkTok').value.trim(), pw = $('#vkPw').value;
  if(!tok) throw new Error('Paste the viewer token.');
  pwCheck(pw, $('#vkPw2').value);
  const r = await tokenReach(tok);
  if(r.view === 401) throw new Error('GitHub doesn’t accept that token. Check it was copied in full.');
  if(r.view !== 200) throw new Error('That token can’t open '+ACCESS.view+'.');
  // The whole point: a viewer token that can open the data repo would show every price.
  if(r.data === 200) throw new Error('That token can open '+ACCESS.data+', so viewers could read every price. Make one for '+ACCESS.view+' only.');
  const rec = { v:1, lock: await vaultLock(tok, pw), expires: r.expires || dateIso($('#vkExp').value), setAt:new Date().toISOString(), setBy:session.name };
  for(let i = 0; i < 3; i++){
    const cur = await ghGetJson(ACCESS.app, VKEY_FILE);
    const w = await ghPutJson(ACCESS.app, VKEY_FILE, rec, cur.missing ? null : cur.sha, 'Set the viewer password');
    if(!w.conflict){ S.ed.vkey = rec; S.panel.vk = false; renderPanel(); toast('Viewer password saved. Live in about a minute.'); return; }
  }
  throw ghErr(409);
});

ACT.saveItem = async b => { const r = itemSave(b.dataset.id, false); if(r){ const op = r.op; op.post = readPost(); await save(r.what, op); } };
function itemSave(id, dry){
  const it = S.doc.items[id], no = (m, k) => { if(!dry) toast(m, k); return null; };
  if(!it || !(can('text') || can('price') || canWeek())) return null;
  const wk = canWeek() ? readWeeks() : {}, wkCh = Object.keys(wk).filter(c => (wk[c] ?? null) !== weekOf(it, c));
  if(!(can('text') || can('price'))){
    if(!wkCh.length) return no('Nothing has changed.');
    return { what:'First weeks of '+it.name, op: doc => { const x = doc.items[id]; if(!x) throw new Error('That tool no longer exists.'); x.weeks = Object.assign({}, x.weeks); wkCh.forEach(c => { if(wk[c]) x.weeks[c] = wk[c]; else delete x.weeks[c]; }); } };
  }
  let patch;
  try{ patch = readToolForm('i'); }catch(e){ return no(e.message, 'err'); }
  let newCost = it.cost;
  if(role().costs && $('#iCost')){
    const raw = $('#iCost').value.trim().replace(/[$,\s]/g, '');
    newCost = raw === '' ? null : Number(raw);
    if(raw !== '' && !(isFinite(newCost) && newCost >= 0)) return no('The price must be a number, or blank if nobody knows it.', 'err');
    if(newCost != null) newCost = Math.round(newCost*100)/100;
  }
  // Quantities typed in Vendor & price, one per buying course.
  const qch = can('assign') ? [...document.querySelectorAll('#panel input[data-qcode]')].map(e => ({ code:e.dataset.qcode, key:e.dataset.qkey, v: e.value.trim() === '' ? null : Number(e.value) }))
    .filter(q => { const l = ((S.doc.courses[q.code] || { lists:{} }).lists[q.key] || []).find(y => y.item === id); return l && (l.qty ?? null) !== q.v; }) : [];
  if(qch.some(q => q.v != null && !(isFinite(q.v) && q.v > 0))) return no('Quantity must be more than zero.', 'err');
  const same = k => k === 'brandRequired' || k === 'adaPrint' ? !!patch[k] === !!it[k] : k === 'usedIn' ? patch[k].join() === (it[k] || []).join() : (patch[k] || '') === (it[k] || '');
  const changes = Object.keys(patch).filter(k => !same(k));
  const costChanged = newCost !== it.cost;
  if(!changes.length && !costChanged && !wkCh.length && !qch.length) return no('Nothing has changed.');
  const what = costChanged ? 'Price of '+it.name+' '+money(it.cost)+' → '+money(newCost) : !changes.length && !qch.length ? 'First weeks of '+it.name : !changes.length && !wkCh.length ? 'Quantity of '+it.name : 'Edit '+it.name;
  return { what, op: doc => {
    const x = doc.items[id]; if(!x) throw new Error('That tool no longer exists.');
    changes.forEach(k => { x[k] = patch[k]; });
    for(const q of qch){ const l = ((doc.courses[q.code] || { lists:{} }).lists[q.key] || []).find(y => y.item === id); if(!l) throw new Error(it.name+' is no longer on '+q.code+'.'); l.qty = q.v; }
    if(wkCh.length){ x.weeks = Object.assign({}, x.weeks); wkCh.forEach(c => { if(wk[c]) x.weeks[c] = wk[c]; else delete x.weeks[c]; }); }
    if(costChanged){ x.cost = newCost; x.costConfirmed = true; x.costHistory.push({ cost:newCost, on:today(), by:user.name || role().label }); }
  } };
}

/* ---- pictures: shrunk in the browser, saved as their own file in the repo ---- */
const _photos = new Map();
async function ghFileB64(path){
  const repo = S.mode === 'view' ? ACCESS.view : cfg.repo;
  const r = await gh('/contents/'+path+'?ref='+encodeURIComponent(cfg.branch), {}, repo);
  if(!r.ok) throw ghErr(r.status);
  const m = await r.json();
  if(m.content && m.encoding === 'base64') return m.content.replace(/\n/g, '');
  const b = await gh('/git/blobs/'+m.sha, {}, repo); if(!b.ok) throw ghErr(b.status);
  return (await b.json()).content.replace(/\n/g, '');
}
async function fillPhotos(){
  if(S.mode !== 'github' && S.mode !== 'view') return;
  for(const img of document.querySelectorAll('img[data-photo]:not([src])')){
    const path = img.dataset.photo;
    if(!/^images\/[A-Za-z0-9_-]+\.jpg$/.test(path)) continue;
    try{
      if(!_photos.has(path)) _photos.set(path, ghFileB64(path).then(b => 'data:image/jpeg;base64,'+b));
      img.src = await _photos.get(path);
    }catch(e){
      _photos.delete(path);
      const t = document.createElement('span'); t.textContent = 'The picture could not be loaded. '+e.message; img.replaceWith(t);
    }
  }
}
function shrinkImage(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try{
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth*k)), h = Math.max(1, Math.round(img.naturalHeight*k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res({ b64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], w, h });
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable')); };
    img.src = url;
  });
}
function pickImage(){ return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => res(i.files[0] || null); i.click(); }); }
async function uploadPhoto(id, file){
  const it = S.doc && S.doc.items[id];
  if(!it || !file) return;
  if(!canEdit() || S.mode !== 'github'){ toast(S.problem || 'Pictures are saved to GitHub. Connect first.', 'err'); return; }
  if(!/^image\//.test(file.type)){ toast('That file isn’t a picture.', 'err'); return; }
  let img;
  try{ img = await shrinkImage(file, 800); }catch(e){ toast('This browser couldn’t read that picture. Try a JPEG or PNG.', 'err'); return; }
  const path = 'images/'+id+'-'+Date.now().toString(36)+'.jpg', who = user.name || role().label;
  toast('Uploading the picture…');
  try{
    const r = await gh('/contents/'+path, { method:'PUT', body: JSON.stringify({ message:'Picture of '+it.name+' (by '+who+')', content:img.b64, branch:cfg.branch, author:ghAuthor() }) });
    if(!r.ok) throw ghErr(r.status);
  }catch(e){ toast(e.message, 'err'); return; }
  // Viewers can't open the data repo, so they get their own copy of the picture.
  try{ const v = await gh('/contents/'+path, { method:'PUT', body: JSON.stringify({ message:'Picture of '+it.name, content:img.b64, branch:cfg.branch, author:ghAuthor() }) }, ACCESS.view); if(!v.ok) throw ghErr(v.status); }
  catch(e){ toast('Saved, but viewers won’t see this picture: '+e.message, 'err'); }
  _photos.set(path, Promise.resolve('data:image/jpeg;base64,'+img.b64));
  await save((it.photo ? 'Replace the picture of ' : 'Add a picture of ')+it.name, doc => {
    const x = doc.items[id]; if(!x) throw new Error('That tool no longer exists.');
    x.photo = { path, w:img.w, h:img.h, on:today(), by:user.name || role().label };
  });
}

// Moves a record to a new code. When it was the only record with the old code,
// its tool list moves too; a list is never silently dropped.
function moveCode(doc, rec, to){
  const from = rec.code;
  if(from === to) return;
  const others = doc.courseDb.courses.filter(r => r !== rec && r.code === from);
  if(!others.length){
    const tl = doc.courses[from];
    if(doc.courses[to]){
      const n = tl ? Object.values(tl.lists).reduce((s, L) => s + L.length, 0) : 0;
      if(n) throw new Error(to+' already has its own tool list, and '+from+' lists '+n+' tool'+(n > 1 ? 's' : '')+'. Remove '+from+'’s tools first, so neither list is lost.');
      delete doc.courses[from];
    } else if(tl){ delete doc.courses[from]; tl.code = to; doc.courses[to] = tl; }
    // The old code is gone entirely, so everything that names it follows the rename.
    doc.courseDb.programs.forEach(p => (p.scenarios || []).forEach(sc => { sc.electives = sc.electives.map(c => c === from ? to : c); }));
    doc.courseDb.courses.forEach(r => { r.prereqs = (r.prereqs || []).map(c => c === from ? to : c); });
    Object.values(doc.items).forEach(it => { if(it.usedIn) it.usedIn = it.usedIn.map(c => c === from ? to : c); });
  }
  rec.code = to;
}

function crsSave(id, dry){
  const cur = S.doc.courseDb.courses.find(x => x.id === id), no = (m, k) => { if(!dry) toast(m, k); return null; };
  if(!cur) return null;
  let patch;
  try{
    const code = normCode($('#rCode').value);
    if(!code) throw new Error('A course needs a code.');
    patch = { code, title: $('#rTitle').value.trim(), credits: numField('#rCredits', 'Credit hours'), weeks: numField('#rWeeks', 'Length in weeks'),
      prereqs: $('#rPrereqs').value.split(',').map(x => normCode(x)).filter(Boolean), status: $('#rStatus').value,
      school: $('#rSchool').value || null, category: $('#rCategory').value || null,
      ...readPrograms() };
  }catch(e){ return no(e.message, 'err'); }
  const newProgs = patch.newProgs; delete patch.newProgs;
  const before = JSON.stringify(CRS_FIELDS.map(f => crsText(cur, f.key)).concat(cur.programs.slice().sort(), ['|'], (cur.electiveIn || []).slice().sort()));
  const after = JSON.stringify(CRS_FIELDS.map(f => f.key === 'deliveryLabel' ? (patch.weeks ? patch.weeks+'-week' : '') : crsText(patch, f.key)).concat(patch.programs.slice().sort(), ['|'], patch.electiveIn.slice().sort()));
  if(before === after) return no('Nothing has changed.');
  const msg = (patch.code !== cur.code ? 'Course '+cur.code+' renamed to '+patch.code : 'Edit course '+crsLabel(cur))+(newProgs.length ? ' (new program '+newProgs.map(x => x.code).join(', ')+')' : '');
  const norm0 = (k, v) => JSON.stringify(Array.isArray(v) ? v.slice().sort() : (v ?? (k === 'prereqs' || k === 'programs' || k === 'electiveIn' ? [] : '')));
  const changed = Object.keys(patch).filter(k => norm0(k, patch[k]) !== norm0(k, cur[k]));
  const oldCode = cur.code;
  return { msg, op: doc => {
    const r = doc.courseDb.courses.find(x => x.id === id);
    if(!r) throw new Error('That course is no longer in the registry.');
    if(changed.includes('code')) moveCode(doc, r, patch.code);

    renderPanel();
    for(const k0 of kept){
      if(k0.id === 'aCourse' || k0.id === 'aKey') continue;
      const el = k0.type === 'radio' ? document.querySelector('#panel input[type=radio][name="'+CSS.escape(k0.name)+'"][value="'+CSS.escape(k0.value)+'"]') : k0.id ? document.getElementById(k0.id) : null;
      if(!el) continue;
      if(k0.type === 'radio' || k0.type === 'checkbox') el.checked = k0.checked; else el.value = k0.value;
    }
    syncToolForm('a');
    renderMatches();
  }
  if(k === 'qty'){
    const { code, key, id } = t.dataset; const v = t.value.trim(); const q = v === '' ? null : Number(v);
    if(q != null && !(isFinite(q) && q > 0)){ toast('Quantity must be more than zero.', 'err'); renderMain(); return; }
    save('Quantity of '+S.doc.items[id].name+' on '+code+': '+(q ?? 'blank'), doc => { const l = doc.courses[code].lists[key].find(x => x.item === id); if(!l) throw new Error('That tool is no longer on '+code+'.'); l.qty = q; });
  }
  if(k === 'materials'){
    const code = t.dataset.code, v = t.type === 'checkbox' ? (t.checked ? 'none' : 'unknown') : t.value, c = S.doc.courses[code];
    const n = Object.values(c.lists).reduce((s, L) => s + L.length, 0);
    if(v !== 'listed' && n){ toast(code+' still lists '+n+' tool'+(n > 1 ? 's' : '')+'. Remove '+(n > 1 ? 'them' : 'it')+' first, so the cost does not silently drop.', 'err'); render(); return; }
    save(code+': '+{ listed:'has tools', none:'no materials', unknown:'not known yet' }[v], doc => {
      const m = Object.values(doc.courses[code].lists).reduce((s, L) => s + L.length, 0);
      if(v !== 'listed' && m) throw new Error('Someone has added tools to '+code+' in the meantime, so it was not marked '+(v === 'none' ? 'as having no materials' : 'unknown')+'.');
      doc.courses[code].materials = v;
    });
  }
});
// A picture can be dropped onto the tool panel's picture box.
// A completed workbook can be dropped onto the import panel.
document.addEventListener('dragover', e => { const box = e.target.closest && e.target.closest('[data-drop],[data-dropx]'); if(!box) return; e.preventDefault(); box.classList.add('drag'); });
document.addEventListener('dragleave', e => { const box = e.target.closest && e.target.closest('[data-drop],[data-dropx]'); if(box) box.classList.remove('drag'); });
document.addEventListener('drop', e => {
  const box = e.target.closest && e.target.closest('[data-drop],[data-dropx]'); if(!box) return;
  e.preventDefault(); box.classList.remove('drag');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(!f) return;
  if(box.dataset.dropx) importFile(f); else uploadPhoto(box.dataset.drop, f);
});
// Esc steps back one level: a menu, then full window to docked, then the panel itself.
window.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const em = $('#expMenu');
  if(!$('#toolsMenu').hidden) closeToolsMenu();
  else if(em && !em.hidden) em.hidden = true;
  else if(S.panel && S.wide){ S.wide = false; render(); }
  else if(S.panel) closePanel();
});
document.addEventListener('mousedown', e => {
  if(!e.target.closest('#toolsWrap') && !e.target.closest('.tab.tool')) closeToolsMenu();
  const em = $('#expMenu'); if(em && !em.hidden && !e.target.closest('#expMenu') && !e.target.closest('#expBtn')) em.hidden = true;
});
// The sidebar folds by itself when a record opens on a narrow screen, so a resize can change it.
let _rz = null, _rzWas = null;
window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { const now = railOn() && railCollapsed(); if(now !== _rzWas){ _rzWas = now; renderRail(); renderMain(); } }, 120); });
// Drag the sidebar's edge or the record panel's edge to resize it. Widths are kept per browser.
let _drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('[data-grip]'); if(!g) return;
  e.preventDefault(); _drag = { side:g.dataset.grip, x:e.clientX, w: g.dataset.grip === 'l' ? S.railW : S.panelW };
  g.classList.add('on'); document.body.classList.add('dragging');
});
document.addEventListener('pointermove', e => {
  if(!_drag) return;
  const dx = e.clientX - _drag.x, w = Math.round(Math.max(240, Math.min(_drag.side === 'l' ? 560 : 900, _drag.side === 'l' ? _drag.w + dx : _drag.w - dx)));
  if(_drag.side === 'l') S.railW = w; else S.panelW = w;
  $('.shell').style.setProperty(_drag.side === 'l' ? '--rail-w' : '--panel-w', w+'px');
});
document.addEventListener('pointerup', () => {
  if(!_drag) return;
  lsSet(_drag.side === 'l' ? 'str_rail_w' : 'str_panel_w', _drag.side === 'l' ? S.railW : S.panelW);
  _drag = null; document.body.classList.remove('dragging'); document.querySelectorAll('.grip.on').forEach(g => g.classList.remove('on'));
});

boot();
</script>
